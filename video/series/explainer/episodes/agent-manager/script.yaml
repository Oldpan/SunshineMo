readings:
  长文: cháng
  重叠: chóng
  重开: chóng
  重写: chóng
  重来: chóng
  差点: chà
  差距: chā
  六百行: háng
  都行: xíng
  衡量: liáng
  长什么样: zhǎng
  有数: shù
  批量: liàng

lexicon:
  "CLAUDE.md": "Claude 点 M D"
  "Claude Code": "Claude Code"
  "/code-review": "斜杠 code review"
  "/batch": "斜杠 batch"
  "/rewind": "斜杠 rewind"
  "/goal": "斜杠 G O A L"
  "p95": "P 九十五"
  "Stop hook": "Stop hook"
  "Esc": "E S C"
  "diff": "diff"
  "lint": "lint"
  "UI": "U I"
  "PR": "P R"
  "@claude": "艾特 Claude"
  "Netflix": "Netflix"
  "spec": "spec"
  "skill": "skill"

scenes:
  # ---------------------------------------------------------------- 开场 · S 瑞士排版
  - id: open
    theme: mx-swiss
    style: flat
    beats:
      - 天天用 coding agent 的人，其实已经在当经理了。
      - 这是 Addy Osmani 刚发的一篇长文。
      - 他在 Anthropic 做 Claude Code。
      - 标题就一句：你的 coding agent，让你成了经理。
      - 文章列了十个习惯，最后还讲了这个类比在哪不成立。

  # ---------------------------------------------------------------- P 象形图形
  - id: manage
    theme: mx-picto
    style: flat
    beats:
      - 想想你和 agent 一天都在干什么。
      - 挑任务，写指令，把活交出去。
      - 跟进进度，验收结果，决定哪些能上线。
      - 这一圈，就是管理。
      - 这里的管理不是让你转岗，也不是说 agent 能替代同事。
      - 意思是，帮别人把活干好，拿出好结果。
      - 用 agent 最顺手的人，不一定最会写提示词，而是学会了管理。

  # ---------------------------------------------------------------- H 半调案卷
  - id: handoff
    theme: mx-dossier
    style: flat
    beats:
      - 你被人领导了很多年，好的交接长什么样，其实心里有数。
      - 你吐槽过的每个坏领导，都能对应一份给 agent 的 bug 报告。
      - 需求说不清，背景不给，预期说变就变。
      - 你写给 agent 的指令，很可能也是这样。
      - 下面十个习惯，按影响从大到小排。

  # ---------------------------------------------------------------- 1 · C 终端
  - id: h1
    theme: mx-term
    style: flat
    beats:
      - 第一个：给它一个检查自己的办法。
      - agent 看着活做完了，就会停下。
      - 你要是把「看着做完了」当完成，就成了它的人肉测试。
      - 好经理不会亲自看完所有东西，靠的是 CI、评审、监控这些护栏。
      - 给 agent 的检查要能判出过和不过，测试、构建、截图都行。
      - 有了检查，它就能自己跑，看到失败，自己改。
      - 最简单的，直接说：跑完测试，不过就接着改。
      - {text: 也可以用 /goal，让另一个模型每轮检查目标达成没有。, say: 也可以用目标命令，让另一个模型每轮检查目标达成没有。}
      - 还能用 Stop hook 卡住：类型检查不过，这一轮就结束不了。
      - 或者让 /code-review 开一个新的子 agent 审 diff，作者不批自己的 PR。

  # ---------------------------------------------------------------- 2 · B 蓝图
  - id: h2
    theme: mx-blue
    style: flat
    beats:
      - 第二个：讲清楚它不知道的。
      - 好经理讲清目标和约束，怎么做，留给干活的人。
      - 军队管这叫指挥官意图，Netflix 叫给上下文，不给控制。
      - agent 接到任务，第一件事就是读你的代码。
      - 目录结构、代码约定，它读得比你讲得快。
      - 你只写仓库里没有的：会上的决定，为什么要做，这次怎么算完。
      - 拿一句「把看板弄快点」来说，可以改成这样。
      - 写清目标：p95 加载时间压到两秒内，再写为什么要做。
      - 写约束和范围外：不改表结构，不改 UI。
      - 最后写怎么检查：跑性能脚本，给出前后数字。
      - 还没想清楚，就让 agent 先采访你，写成 spec 文件，再开新会话去做。

  # ---------------------------------------------------------------- 3 · D 软木板
  - id: h3
    theme: mx-cork
    style: flat
    beats:
      - 第三个：让每次纠正都能攒下来。
      - 同一件事纠正了两次，就写进团队的 CLAUDE.md，或者做成 skill。
      - CLAUDE.md 要短，写四类东西。
      - 怎么验证，写具体命令。还有代码里容易误导的地方。
      - 仓库里没有的决定，和纠正过两次的事。
      - 有的团队在代码评审里直接 @claude，把反馈变成长期规则。
      - 隔一阵再看看，新模型是不是已经不需要这些纠正了。

  # ---------------------------------------------------------------- 4 · S 瑞士排版
  - id: h4
    theme: mx-swiss
    style: flat
    beats:
      - 第四个：默认让它做主，只锁死不能弯的。
      - 格鲁夫在《高产出管理》里讲过任务相关成熟度。
      - 管多严，看这个人在这件事上的表现，不看他整体多强。
      - 在 Claude Code 里，提示词、CLAUDE.md、skill 是请求，模型会考虑，自己决定。
      - hook、deny 规则、managed settings 是要求，一定执行。
      - 大多数时候让它判断，它看着真实代码，常常判断得更准。
      - 硬性要求才用强制，比如永远不改生成的客户端。
      - CLAUDE.md 里一再强调还是没用，就该改成 hook。
      - 只是偏好的东西写进了 hook，就该删掉。
      - 全大写的规则，think harder，这些老习惯可以停了。
      - 过度流程，就是新的微观管理。

  # ---------------------------------------------------------------- 5 · R 战术板
  - id: h5
    theme: mx-pitch
    style: flat
    beats:
      - 第五个：先定计划，再拆不重叠的活。
      - 先进 plan mode，把计划聊对，再交出去写代码。
      - 大任务再开一个会话，像 staff 工程师那样审一遍计划。
      - 审的时候找它的假设，就像一对一时问一句：你哪里没把握？
      - 拆活也能交给 agent，/batch 能把一个大改动拆成五到三十个任务。
      - 每个任务一个 worktree，各开一个 PR。
      - 你只要看有没有重叠，共享接口先合进去。
      - 五个 agent 干重叠的活，产出不会翻五倍。
      - 只会得到一个合并冲突，作者有五个。

  # ---------------------------------------------------------------- 6 · C 终端
  - id: h6
    theme: mx-term
    style: flat
    beats:
      - 第六个：早纠偏，快重来。
      - 盯住它的第一分钟，一跑偏就按 Esc。
      - 能干的人反复失手，问题常常在上游：指令、上下文或者范围。
      - 纠正两次还不对，就清掉会话，带着教训重写提示词。
      - 第三次纠正，多半只是让它把失败记录再读一遍。
      - /rewind 能把代码和对话一起退回去，大胆的方案也敢先试。
      - 试完复盘，能通用的写进 CLAUDE.md。

  # ---------------------------------------------------------------- 7 · H 半调案卷
  - id: h7
    theme: mx-dossier
    style: flat
    beats:
      - 第七个：委派任务，不委派判断。
      - agent 干活，重要的事你来定：产品取舍、安全边界、什么能上线。
      - 作者自己就差点栽过。他让 agent 研究和竞品的差距，再写 PR 补上。
      - 代码扫了一眼就差点推上去，这些改动加了复杂度，好处很少。
      - 六百行 diff，测试全绿，命名看着合理，那就批了吧。
      - 这不叫代码评审，叫代码盖章。
      - 风格、lint、常见 bug、单元测试，交给 agent。
      - 安全边界、合规、产品决定，留给人。
      - 改动保持小，一次审多少，就是一次能看懂多少。

  # ---------------------------------------------------------------- 8 · B 蓝图
  - id: h8
    theme: mx-blue
    style: flat
    beats:
      - 第八个：设计一个不用你盯的运行。
      - 越级的经理不管每个人的活，管的是目标、护栏和检查点。
      - 睡前放它跑一整夜之前，先问自己五个问题。
      - 它知道怎样算完吗？目标条件、spec 文件，或者一个要变绿的测试。
      - 它能自己验证吗？测试、Stop hook，或者评审。
      - 边界在哪？权限、沙箱、worktree，或者唯一能推的分支。
      - 护栏是什么？轮数上限，或者花费上限。
      - 结果放哪，谁来批？不可逆的操作，要人来批。
      - 批量任务先在三个文件上试点，新东西头几次要看着，就当试用期。

  # ---------------------------------------------------------------- 9 · V 数据图
  - id: h9
    theme: mx-data
    style: flat
    beats:
      - 第九个：扩的是验证，不是注意力。
      - 下属一多，每个人分到的经理就少了，质量跟着往下走。
      - agent 也一样，作者管这叫编排税。
      - 过了头几个，每多一个 agent，要的注意力比上一个还多。
      - 他平时开四五个后台 agent，加几个本地会话，有时候就嫌多了。
      - 想多开，就得少盯：交给自检、目标和新的评审者。
      - 衡量系统，别衡量动静：看 PR 周期，返工和回滚的次数。
      - AI 写了百分之几的代码，不是一个有用的目标。
      - 统计了合并多少 PR，也要统计回滚和返工。

  # ---------------------------------------------------------------- 10 · S 瑞士排版
  - id: h10
    theme: mx-swiss
    style: flat
    beats:
      - 第十个：决定不做什么。
      - 经理最重要的一个字，常常是「不」。
      - 有了 agent，开工几乎免费，午饭前就能给任何一个点子开 PR。
      - 可每个 PR 都要有人审，要做安全检查，要长期维护。
      - 现在稀缺的，是评审和验证。
      - 所以老问题更要问：谁要的？怎么算成功？什么时候停？
      - 问题不再是能不能做，而是该不该做。

  # ---------------------------------------------------------------- 类比失效 · P 象形图形
  - id: breaks
    theme: mx-picto
    style: flat
    beats:
      - 这个类比好用，但有七个地方对不上。
      - 管人更难。跑过五个 agent，不等于能管五个人。
      - 返工几乎免费，可以让 agent 把两三个方案都做出来比。
      - agent 没有经验，只有笔记本，教训得写下来给整个团队。
      - 好工程师会反驳你，agent 多半照做，可以让它反过来驳自己的答案。
      - 所有 agent 的强项和弱项都一样，而且每次模型更新都在变。
      - agent 接走了入门的活，新人练基本功的机会，要你刻意留出来。
      - 还有，人的团队仍然重要，别让管 agent 挤掉带团队的时间。

  # ---------------------------------------------------------------- 收尾 · A 编辑排版
  - id: outro
    theme: mx-edit
    style: flat
    beats:
      - 好的 staff 工程师一直是这么做的：写设计文档，讲清背景，认真评审。
      - 明天就能试的六件事。
      - 每个任务配一个能跑的检查，要证据。
      - 告诉它看不到的，省掉它看得到的。
      - 先聊计划，再写代码。
      - 纠正两次就写进 CLAUDE.md，重复的流程做成 skill。
      - 纠正两次还不行，就重开会话，重写提示词。
      - 审 diff 的时候，当它出了事会把你叫醒。
      - 你不一定想当经理，但用好 agent 的人，都顺手学会了管理。
      - {text: 我是老潘，下期再见。, pause: 0.8}
