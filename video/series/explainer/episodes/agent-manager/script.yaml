# 天天用 AI 写代码，你已经是个经理了 · Addy Osmani X 长文《Your coding agents made you a manager》（2026-11-08）
# 完整出处见 source/article.md（复核只认这份资料）。用户要求：横版约 7 分钟，只在片头提一次原文，之后直接讲内容。
# 画风按场景切换（用户逐场选定 2026-11-08）：S 瑞士排版 · P 象形图形 · H 半调案卷 · C 终端 · B 蓝图 · D 软木板 · R 战术板 · V 数据图 · A 编辑排版。
