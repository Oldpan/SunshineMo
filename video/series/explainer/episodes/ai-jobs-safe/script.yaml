scenes:
  # ---------------------------------------------------------------- 开场
  - id: open
    theme: yellow
    nav: intro
    beats:
      - 2026 年，大公司的裁员新闻，差不多一个月一条。
      - 一月，亚马逊宣布裁掉大约一万六千个公司职位。
      - 算上去年十月那一轮，前后三万人。
      - 公司说，是要减少层级、少点官僚。
      - 二月，Block 一次裁掉四千多人，员工从一万出头砍到不到六千。
      - CEO 杰克·多尔西说得很直白：因为 AI 工具。
      - 三月底，甲骨文开始裁员，没公布人数，分析师估计两到三万。
      - 四月，Meta 宣布裁掉一成员工，大约八千人。
  - id: title
    theme: yellow
    nav: intro
    beats:
      - 被裁的都是什么人？哪些工作还安全？
      - 这期我们就闯三关，一关一关看。

  # ---------------------------------------------------------------- 被裁的是谁
  - id: who
    theme: mint
    nav: who
    beats:
      - 先看被裁的是谁。这一轮有两个特点。
      - 第一，主要是科技公司和信息服务公司。
      - 别的行业也裁员，但更多是换岗：这边裁一批，那边招一批。
      - 科技公司这回裁掉的，很多就不补了。
      - Meta 除了裁八千人，还关掉了六千个招聘中的岗位。
      - 第二，被裁的多是坐办公室的白领。
      - 亚马逊这两轮，裁的是公司职位，不是仓库和配送。
      - 去年 CEO 贾西就说过，生成式 AI 会让公司的白领岗位变少。
      - 为什么先轮到白领？因为 AI 最擅长的，就是文字、表格、代码这些电脑里的活。
      - 一整天坐在电脑前处理信息的工作，正好撞在 AI 的枪口上。
  - id: canary
    theme: mint
    nav: who
    beats:
      - 斯坦福的一项研究，看到了同一个方向。
      - 在 AI 最容易接手的职业里，22 到 25 岁的年轻人，
      - 就业人数比别的职业的同龄人，落后了百分之十九。
      - 这类职业里，就有写代码的程序员和客服。
      - 而且主要不是被开除，是公司不招新人了。
      - 反过来，在 AI 只是帮手的职业里，就业没有降，有的还在涨。
      - 有容易被替代的，就有不容易被替代的。
      - 我把它们分成三类，一类一关。

  # ---------------------------------------------------------------- 第一关 拍板兜底
  - id: r1_card
    hold: 1.2
    theme: peach
    nav: r1
    beats:
      - 第一关：拍板兜底的工作。
  - id: r1_power
    theme: peach
    nav: r1
    beats:
      - 先说拍板。拍板就是能调动钱、人和资源，让事情按你的决定发生。
      - 你可以让 AI 替你干很多活，但最后点头的，还是你。
      - AI 再聪明，也是人造出来的工具。
      - 人会用工具，但不会把决定权交给工具。
      - 所以管钱、管人、管资源的位置，老板、管理者、法官，短期都很难交给 AI。
  - id: r1_blame
    theme: peach
    nav: r1
    beats:
      - 拍板的另一面，是兜底。
      - 一台手术出了事，一个案子判错了，总得有人负责。
      - AI 可以给建议，但它没法被追责，没法赔偿，也没法被吊销执照。
      - 自动驾驶撞了人，该算谁的？这个问题到现在还在争。
      - 医疗和司法，都靠一整套追责体系，撑着大家的信任。
      - 想让 AI 背锅？病人第一个不答应。
      - 整个行业的信用，也会跟着动摇。
  - id: r1_mercy
    theme: peach
    nav: r1
    beats:
      - 今年初上映的电影《Mercy》，讲的就是 AI 当法官。
      - 被告要在九十分钟里，向 AI 法官证明自己没有杀人。
      - AI 能翻遍所有证据。可要是判错了，谁来负责？
  - id: r1_watch
    theme: peach
    nav: r1
    beats:
      - 还有一类兜底的工作，是 AI 带来的新岗位：盯着 AI 的人。
      - AI 能做什么、不能做什么、为谁做，得由人来定。
      - 还得有人防着别人拿 AI 干坏事，比如诈骗和造假。
      - 做 AI 安全的、做审核的、做合规的，都是这一类。
      - AI 越强，这类人越缺。第一关，过！

  # ---------------------------------------------------------------- 第二关 现场
  - id: r2_card
    hold: 1.2
    theme: blue
    nav: r2
    beats:
      - 第二关：现场的工作。
  - id: r2_scene
    theme: blue
    nav: r2
    beats:
      - 家政、上门维修、装修、律师，有个共同点。
      - 每一单面对的人和环境都不一样，得到了现场才知道怎么干。
      - 水管工上门，先得看墙怎么砌的、管子怎么走的、主人想要什么。
      - 家政也是，每家的户型、习惯、要求都不一样。
      - 律师也一样，每个案子、每个当事人都不同。
      - 机器人和 AI 最擅长的，是固定、重复、能预测的活。
      - 比如流水线，比如仓库分拣。
  - id: r2_cost
    theme: blue
    nav: r2
    beats:
      - 要应付每次都不一样的现场，就得有很强的算力和很贵的机器。
      - 不是 AI 做不到，是现在请人更划算。
      - 只要用 AI 比用人贵，老板就会继续用人。
      - 所以这一关，是短期安全。
      - 机器越来越便宜，这条线也会慢慢往后退。第二关，过！

  # ---------------------------------------------------------------- 第三关 非你不可
  - id: r3_card
    hold: 0.6
    theme: pink
    nav: r3
    beats:
      - 第三关：非你不可的工作。
      - 别人花钱，买的就是你这个人。分四种情况。
  - id: r3_art
    theme: pink
    nav: r3
    beats:
      - 第一种，人就是作品。
      - 毕加索的画那么贵，买的不只是一张画，还有毕加索这个人。
      - 看电影前，我们会先看是谁演的。
      - 演员、歌手、偶像，卖的都是本人。AI 也会有自己的明星，但抢不走真人的。
  - id: r3_care
    theme: pink
    nav: r3
    beats:
      - 第二种，给人情绪价值。
      - 护理、心理咨询、陪伴老人、照顾孩子、助产。
      - AI 能模仿人的情绪，但只要有一点不自然，人就会觉得别扭，甚至害怕。
      - 这叫恐怖谷效应。
      - 快餐店可以让机器点单，可高级餐厅要是换成机器人服务员，味道就不对了。
      - 就算有一天模仿得一模一样，很多时候，我们还是想要一个真人在身边。
  - id: r3_joy
    theme: pink
    nav: r3
    beats:
      - 第三种，做的人自己开心。
      - 球员、舞者、音乐人、科研人员，很多人不为钱也愿意干。
      - 写歌的乐趣就在写的过程。AI 一秒写完，你还开心什么？
      - 机器人替你上场踢球，你只能坐在场边看。
      - 不是说 AI 不会写歌、不会踢球。
      - AI 做它的，跟你享受这件事，没有关系。
      - 这么开心的事，谁愿意让给 AI 呢？
  - id: r3_old
    theme: pink
    nav: r3
    beats:
      - 第四种，传了上千年的手艺。
      - 京剧、相声、说书，还有各种手艺人。
      - 它们早就是文化的一部分，有人守着，有人传着。
      - 这些行当熬过了一次又一次技术革命，靠的是师傅带徒弟，一代一代往下传。
      - 越古老的行当，越难被替代。第三关，过！

  # ---------------------------------------------------------------- 自测
  - id: test
    theme: lavender
    nav: test
    beats:
      - 回顾一下这三关：拍板兜底的，在现场的，非你不可的。
      - 听下来，好像离多数人有点远？
      - 别急，它们有三个共同点，你可以拿来测测自己的工作。
      - 第一问：你在不在金字塔尖？哪一行做到顶尖，都不容易被替代。
      - 顶尖的医生、律师、工匠，AI 是他们的帮手，不是对手。
      - 第二问：你的工作是不是全在电脑上？全在电脑上的，最容易被 AI 接手。
      - 反过来，要动手、要见人、要到现场的，就安全一些。
      - 第三问：你是不是按产量挣钱？干得越多挣得越多，就是在跟 AI 比效率。
      - 现在造 AI，最主要的目的就是提高效率。跟 AI 拼产量，拼不过。
      - 比如写代码，以前多招人就能多写，现在 AI 也能写，这条路就窄了。
      - 可外科医生一天能做的手术就那么几台，不是多招人就能翻倍。
      - 后两问都答不是，你的工作就相对安全。

  # ---------------------------------------------------------------- 结尾
  - id: wef
    theme: lavender
    nav: end
    beats:
      - 也别太悲观。世界经济论坛预测，到 2030 年，
      - 全球会新增一亿七千万个岗位，同时消失九千二百万个。
      - 减少的主要是文员、行政这类重复性的岗位。
      - 增长的，除了 AI、数据和网络安全，还有护理和教育。
      - 工作不会一下子没了，但会大换血。
  - id: outro
    theme: yellow
    nav: end
    beats:
      - 马斯克去年说过：我的预测是，工作会变成可选的。
      - 想干活的人，就像在自家院子里种菜，累一点，但开心。
      - 做视频也一样。批量生产、比谁更新得快的，最容易被替代。
      - 可如果你享受做它的过程，AI 再厉害，也抢不走这份乐趣。
      - 这么看，哪份工作最安全？
      - 是你真心想做、不给钱也愿意做的那一份。
