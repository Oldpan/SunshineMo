lexicon:
  "/goal clear": "斜杠 G O A L clear"
  "/goal": "斜杠 G O A L"
  "/effort medium": "斜杠 effort medium"
  "/doctor prompt-audit": "斜杠 doctor prompt audit"
  "/code-review": "斜杠 code review"
  "/security-review": "斜杠 security review"
  "CLAUDE.md": "Claude 点 M D"
  "TASKS.md": "Tasks 点 M D"
  "REVIEW.md": "Review 点 M D"
  "Opus 5.5": "Opus 五点五"
  "Opus 5": "Opus 五"
  "Claude 5": "Claude 五"
  "5.5": "五点五"
  "128000": "十二万八千"
  "max_tokens": "max tokens"
  "TodoWrite": "to do write"
  "PreToolUse": "Pre Tool Use"
  "SDK": "S D K"
  "VM": "V M"
