<svg xmlns="http://www.w3.org/2000/svg" width="760" height="440" viewBox="0 0 760 440"><style>
text{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#1f2328}
.t{font-size:19px;font-weight:700}
.s{font-size:13px;fill:#59636e}
.f{font-size:12px;fill:#59636e}
.h{font-size:14px;font-weight:700}
.b{font-size:13px}
.m{font-size:12px;font-family:ui-monospace,"SF Mono",Menlo,Consolas,"Noto Sans Mono CJK SC",monospace}
.w{fill:#fff}
</style><defs><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6e7781"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#c4372e"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2f6fdb"/></marker><marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1a7f37"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9a6700"/></marker></defs><rect width="760" height="440" fill="#ffffff"/><text x="24" y="38" class="t">一条任务提示里值得写的四块</text><text x="24" y="62" class="s">以第 1 节的接口迁移任务为例，左边写进提示，右边交给 agent 自己定</text><rect x="24" y="88" width="440" height="56" rx="8" fill="#eaf1fd" stroke="#2f6fdb" stroke-width="1.2"/><rect x="24" y="88" width="6" height="56" rx="3" fill="#2f6fdb"/><text x="44" y="112" class="h" fill="#2f6fdb">完整任务</text><text x="44" y="134" class="b">把 src/api 下的旧 SDK 调用迁移到新 SDK</text><rect x="24" y="156" width="440" height="76" rx="8" fill="#e8f5ec" stroke="#1a7f37" stroke-width="1.2"/><rect x="24" y="156" width="6" height="76" rx="3" fill="#1a7f37"/><text x="44" y="180" class="h" fill="#1a7f37">完成条件</text><text x="44" y="202" class="b">响应字段、错误码、超时行为保持兼容</text><text x="44" y="222" class="b">uv run pytest -q tests/api 通过，新增 3 类用例</text><rect x="24" y="244" width="440" height="76" rx="8" fill="#fdf3dc" stroke="#9a6700" stroke-width="1.2"/><rect x="24" y="244" width="6" height="76" rx="3" fill="#9a6700"/><text x="44" y="268" class="h" fill="#9a6700">范围和停止点</text><text x="44" y="290" class="b">不改无关模块，不删或跳过测试，不部署生产</text><text x="44" y="310" class="b">缺凭据、需求冲突、要改公共接口时先停下来问</text><rect x="24" y="332" width="440" height="56" rx="8" fill="#f1ecfb" stroke="#6f42c1" stroke-width="1.2"/><rect x="24" y="332" width="6" height="56" rx="3" fill="#6f42c1"/><text x="44" y="356" class="h" fill="#6f42c1">汇报方式</text><text x="44" y="378" class="b">diff 摘要、实际运行的命令和结果、未验证的部分</text><rect x="490" y="88" width="246" height="150" rx="8" fill="#f3f4f6" stroke="#d0d7de" stroke-width="1.2" stroke-dasharray="5 4"/><text x="508" y="114" class="h" fill="#6e7781">交给 agent 自己定</text><text x="508" y="140" class="b" fill="#59636e">先搜哪些文件</text><text x="508" y="162" class="b" fill="#59636e">函数怎么拆、按什么顺序改</text><text x="508" y="184" class="b" fill="#59636e">中间跑哪些临时命令</text><text x="508" y="206" class="b" fill="#59636e">什么时候拆给 subagent</text><rect x="490" y="256" width="246" height="128" rx="8" fill="#fcebea" stroke="#c4372e" stroke-width="1.2" stroke-dasharray="5 4"/><text x="508" y="282" class="h" fill="#c4372e">可以删掉的句子</text><text x="508" y="310" class="b" fill="#59636e">请认真思考</text><line x1="506" y1="305" x2="575" y2="305" stroke="#c4372e" stroke-width="1.4"/><text x="508" y="334" class="b" fill="#59636e">务必全面检查</text><line x1="506" y1="329" x2="588" y2="329" stroke="#c4372e" stroke-width="1.4"/><text x="508" y="358" class="b" fill="#59636e">完成前反复确认</text><line x1="506" y1="353" x2="601" y2="353" stroke="#c4372e" stroke-width="1.4"/><text x="24" y="424" class="f">示意图，内容对应正文里的示例提示；目录和测试命令是假设仓库中的</text></svg>