<svg xmlns="http://www.w3.org/2000/svg" width="760" height="560" viewBox="0 0 760 560"><style>
text{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#1f2328}
.t{font-size:19px;font-weight:700}
.s{font-size:13px;fill:#59636e}
.f{font-size:12px;fill:#59636e}
.h{font-size:14px;font-weight:700}
.b{font-size:13px}
.m{font-size:12px;font-family:ui-monospace,"SF Mono",Menlo,Consolas,"Noto Sans Mono CJK SC",monospace}
.w{fill:#fff}
</style><defs><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6e7781"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#c4372e"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2f6fdb"/></marker><marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1a7f37"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9a6700"/></marker></defs><rect width="760" height="560" fill="#ffffff"/><text x="24" y="38" class="t">/goal 的一轮：执行和判定分开</text><text x="24" y="62" class="s">evaluator 不调用工具，只读对话里已经出现的内容</text><rect x="24" y="92" width="300" height="130" rx="8" fill="#eaf1fd" stroke="#2f6fdb" stroke-width="1.2"/><text x="44" y="118" class="h" fill="#2f6fdb">主 agent 的一轮</text><text x="44" y="144" class="b">改代码、跑测试命令</text><text x="44" y="165" class="b">把命令、退出码、结果摘要</text><text x="44" y="186" class="b">写进对话</text><rect x="436" y="92" width="300" height="130" rx="8" fill="#f1ecfb" stroke="#6f42c1" stroke-width="1.2"/><text x="456" y="118" class="h" fill="#6f42c1">evaluator</text><text x="456" y="144" class="b">输入：goal 条件 + 到目前为止的对话</text><text x="456" y="165" class="b">不读文件、不跑命令</text><text x="456" y="186" class="b">输出：一个判定 + 一句理由</text><line x1="324" y1="157" x2="434" y2="157" stroke="#6e7781" stroke-width="1.6" marker-end="url(#ag)"/><text x="379" y="148" class="f" text-anchor="middle">轮结束</text><rect x="24" y="280" width="216" height="84" rx="8" fill="#fdf3dc" stroke="#9a6700" stroke-width="1.2"/><text x="42" y="306" class="h" fill="#9a6700">未达成</text><text x="42" y="330" class="b">理由作为下一轮的指引</text><text x="42" y="350" class="b">主 agent 继续干</text><rect x="272" y="280" width="216" height="84" rx="8" fill="#e8f5ec" stroke="#1a7f37" stroke-width="1.2"/><text x="290" y="306" class="h" fill="#1a7f37">已达成</text><text x="290" y="330" class="b">清除 goal</text><text x="290" y="350" class="b">记一条 achieved</text><rect x="520" y="280" width="216" height="84" rx="8" fill="#fcebea" stroke="#c4372e" stroke-width="1.2"/><text x="538" y="306" class="h" fill="#c4372e">不可能达成</text><text x="538" y="330" class="b">清除 goal</text><text x="538" y="350" class="b">记一条 failed 和理由</text><line x1="586" y1="222" x2="132" y2="278" stroke="#9a6700" stroke-width="1.6" marker-end="url(#aa)"/><line x1="586" y1="222" x2="380" y2="278" stroke="#1a7f37" stroke-width="1.6" marker-end="url(#agr)"/><line x1="586" y1="222" x2="628" y2="278" stroke="#c4372e" stroke-width="1.6" marker-end="url(#ar)"/><path d="M24 322 L12 322 L12 190 L22 190" fill="none" stroke="#9a6700" stroke-width="1.6" marker-end="url(#aa)"/><rect x="24" y="386" width="712" height="108" rx="8" fill="#f3f4f6" stroke="#d0d7de" stroke-width="1.2"/><text x="42" y="410" class="h" fill="#6e7781">几道兜底</text><text x="42" y="434" class="b">后台命令或 subagent 还在跑：本轮跳过评估，等后台活结束的那一轮再判</text><text x="42" y="455" class="b">连续几轮没有工具调用：循环停下，控制权还给你，goal 保留</text><text x="42" y="476" class="b">认证失败、额度耗尽、上下文溢出且压缩不掉、模型不可用：直接清掉 goal</text><text x="24" y="527" class="f">依据 Claude Code /goal 文档（2026-10）。evaluator 默认跑在配置的 small fast model 上，</text><text x="24" y="544" class="f">可用 ANTHROPIC_DEFAULT_HAIKU_MODEL 换模型，但这个变量也会影响其他后台功能</text></svg>