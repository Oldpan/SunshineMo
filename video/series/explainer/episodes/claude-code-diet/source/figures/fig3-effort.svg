</style><defs><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6e7781"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#c4372e"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2f6fdb"/></marker><marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1a7f37"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9a6700"/></marker></defs><rect width="760" height="488" fill="#ffffff"/><text x="24" y="38" class="t">Opus 5.5 的 effort：默认降了一档</text><text x="24" y="62" class="s">上：API 文档里两代 Opus 的默认档位；下：Claude Code 决定本次用哪一档的顺序</text><text x="24" y="121" class="h">Opus 5</text><rect x="130" y="96" width="112" height="36" rx="6" fill="#f3f4f6" stroke="#d0d7de" stroke-width="1.2"/><text x="186.0" y="119" class="b" text-anchor="middle" fill="#59636e">low</text><rect x="248" y="96" width="112" height="36" rx="6" fill="#f3f4f6" stroke="#d0d7de" stroke-width="1.2"/><text x="304.0" y="119" class="b" text-anchor="middle" fill="#59636e">medium</text><rect x="366" y="96" width="112" height="36" rx="6" fill="#2f6fdb" stroke="#2f6fdb" stroke-width="1.2"/><text x="422.0" y="119" class="b" text-anchor="middle" fill="#fff">high · 默认</text><rect x="484" y="96" width="112" height="36" rx="6" fill="#f3f4f6" stroke="#d0d7de" stroke-width="1.2"/><text x="540.0" y="119" class="b" text-anchor="middle" fill="#59636e">xhigh</text><rect x="602" y="96" width="112" height="36" rx="6" fill="#f3f4f6" stroke="#d0d7de" stroke-width="1.2"/><text x="658.0" y="119" class="b" text-anchor="middle" fill="#59636e">max</text><text x="24" y="173" class="h">Opus 5.5</text><rect x="130" y="148" width="112" height="36" rx="6" fill="#f3f4f6" stroke="#d0d7de" stroke-width="1.2"/><text x="186.0" y="171" class="b" text-anchor="middle" fill="#59636e">low</text><rect x="248" y="148" width="112" height="36" rx="6" fill="#2f6fdb" stroke="#2f6fdb" stroke-width="1.2"/><text x="304.0" y="171" class="b" text-anchor="middle" fill="#fff">medium · 默认</text><rect x="366" y="148" width="112" height="36" rx="6" fill="#f3f4f6" stroke="#d0d7de" stroke-width="1.2"/><text x="422.0" y="171" class="b" text-anchor="middle" fill="#59636e">high</text><rect x="484" y="148" width="112" height="36" rx="6" fill="#f3f4f6" stroke="#d0d7de" stroke-width="1.2"/><text x="540.0" y="171" class="b" text-anchor="middle" fill="#59636e">xhigh</text><rect x="602" y="148" width="112" height="36" rx="6" fill="#f3f4f6" stroke="#d0d7de" stroke-width="1.2"/><text x="658.0" y="171" class="b" text-anchor="middle" fill="#59636e">max</text><text x="24" y="222" class="f">xhigh、max：只给已经测出质量收益的任务；Opus 5.5 每轮思考往往比 Opus 5 多，这两档更明显</text><rect x="24" y="250" width="224" height="104" rx="8" fill="#e8f5ec" stroke="#1a7f37" stroke-width="1.2"/><text x="40" y="276" class="h">① 显式指定</text><text x="40" y="302" class="m">CLAUDE_CODE_EFFORT_LEVEL</text><text x="40" y="323" class="m">--effort  /  /effort</text><line x1="248" y1="302" x2="266" y2="302" stroke="#6e7781" stroke-width="1.6" marker-end="url(#ag)"/><rect x="268" y="250" width="224" height="104" rx="8" fill="#fdf3dc" stroke="#9a6700" stroke-width="1.2"/><text x="284" y="276" class="h">② 设置文件</text><text x="284" y="302" class="b">modelSettings 按模型存的档位</text><text x="284" y="323" class="b">其次是 effortLevel *</text><line x1="492" y1="302" x2="510" y2="302" stroke="#6e7781" stroke-width="1.6" marker-end="url(#ag)"/><rect x="512" y="250" width="224" height="104" rx="8" fill="#f3f4f6" stroke="#d0d7de" stroke-width="1.2"/><text x="528" y="276" class="h">③ 模型默认</text><text x="528" y="302" class="b">Opus 5.5：medium</text><text x="528" y="323" class="b">Opus 5：high</text><text x="24" y="380" class="b">按顺序取第一个有值的。/effort 后面直接打档位会存成默认值；只想本次生效，在滑块里按 s</text><text x="24" y="402" class="b">max 除非用环境变量指定，否则只在当前会话生效</text><text x="24" y="438" class="f">* user settings 顶层的 effortLevel 对 Opus 5.5 不生效</text><text x="24" y="455" class="f">依据 Claude Platform Effort 与 Claude Code model-config 文档（2026-10）；</text><text x="24" y="472" class="f">“5.5 的 medium 匹配或超过 5 的 high”是 Anthropic 自家评测结论，我没有复测</text></svg>