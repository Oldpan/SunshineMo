<svg xmlns="http://www.w3.org/2000/svg" width="760" height="470" viewBox="0 0 760 470"><style>
text{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#1f2328}
.t{font-size:19px;font-weight:700}
.s{font-size:13px;fill:#59636e}
.f{font-size:12px;fill:#59636e}
.h{font-size:14px;font-weight:700}
.b{font-size:13px}
.m{font-size:12px;font-family:ui-monospace,"SF Mono",Menlo,Consolas,"Noto Sans Mono CJK SC",monospace}
.w{fill:#fff}
</style><defs><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6e7781"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#c4372e"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2f6fdb"/></marker><marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1a7f37"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9a6700"/></marker></defs><rect width="760" height="470" fill="#ffffff"/><text x="24" y="38" class="t">cloud session 能看到什么</text><text x="24" y="62" class="s">以 claude --cloud 的 GitHub clone 方式为例，本机东西要经过 GitHub 才能到 VM</text><rect x="24" y="92" width="220" height="300" rx="8" fill="#f3f4f6" stroke="#d0d7de" stroke-width="1.2"/><text x="42" y="118" class="h">你的电脑</text><text x="42" y="146" class="b">已 commit 并 push 的代码</text><text x="42" y="172" class="b">未 push 的 commit</text><text x="42" y="198" class="b">工作区未提交的改动</text><text x="42" y="224" class="b">~/.claude 用户级配置</text><text x="42" y="250" class="b">本地 GPU、数据库、内网服务</text><rect x="282" y="160" width="180" height="116" rx="8" fill="#eaf1fd" stroke="#2f6fdb" stroke-width="1.2"/><text x="298" y="186" class="h" fill="#2f6fdb">GitHub</text><text x="298" y="212" class="b">当前分支</text><text x="298" y="234" class="b">claude/ 工作分支</text><text x="298" y="256" class="b">PR</text><rect x="500" y="92" width="236" height="300" rx="8" fill="#e8f5ec" stroke="#1a7f37" stroke-width="1.2"/><text x="518" y="118" class="h" fill="#1a7f37">云端 VM（每个任务一台）</text><text x="518" y="146" class="b">约 4 vCPU / 16 GB / 30 GB</text><text x="518" y="172" class="b">clone 到新的 claude/ 分支</text><text x="518" y="198" class="b">只能 push 自己的工作分支</text><text x="518" y="224" class="b">仓库里的 CLAUDE.md、rules、</text><text x="518" y="250" class="b">skills、agents、commands</text><text x="518" y="276" class="b">环境：setup script、网络白名单、</text><text x="518" y="302" class="b">变量和凭据</text><text x="518" y="328" class="b">空闲会被回收，重开是新 VM</text><line x1="244" y1="146" x2="280" y2="190" stroke="#2f6fdb" stroke-width="1.6" marker-end="url(#ab)"/><text x="252" y="140" class="f">push</text><line x1="462" y1="200" x2="498" y2="200" stroke="#2f6fdb" stroke-width="1.6" marker-end="url(#ab)"/><text x="466" y="192" class="f">clone</text><line x1="498" y1="250" x2="464" y2="250" stroke="#1a7f37" stroke-width="1.6" marker-end="url(#agr)"/><text x="466" y="242" class="f">分支/PR</text><path d="M244 172 L268 172 L268 330 L470 330" fill="none" stroke="#c4372e" stroke-width="1.6" stroke-dasharray="5 4"/><path d="M474 322 L490 338 M490 322 L474 338" stroke="#c4372e" stroke-width="2.4"/><text x="276" y="350" class="f" fill="#c4372e">没 push 的、只在本机的，云端看不到</text><text x="24" y="437" class="f">依据 Addy Osmani《Claude Code in the cloud》（2026-10-06）。仓库没有 GitHub remote 或没装 App 时，</text><text x="24" y="454" class="f">Claude Code 改为上传仓库 bundle，此时能否 push 回去取决于 GitHub 连接的权限</text></svg>