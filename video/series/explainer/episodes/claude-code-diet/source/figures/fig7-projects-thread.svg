e/settings.json 的 hooks</text><text x="24" y="339" class="f">依据 Claude Code Projects 文档（2026-10，beta）。想用本机的 MCP、hooks 和权限规则，</text><text x="24" y="356" class="f">可以让这个 thread 通过 Remote Control 跑在自己电脑上</text></svg>