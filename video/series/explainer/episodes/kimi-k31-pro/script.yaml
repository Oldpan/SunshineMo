scenes:
  # ------------------------------------------------------------------ intro
  - id: cover
    theme: kimi
    nav: intro
    beats:
      - 月之暗面刚发布 Kimi K3.1 Pro，三万亿参数级的开源模型。
      - 终端编程测试拿到 65.7，离 Opus 5.5 只差 0.7。
      - 但最有意思的是，他们故意把它的一项能力调低了。
      - 底座、后训练、跑分和这一刀，一次讲透。

  - id: whatis
    theme: kimi
    nav: intro
    beats:
      - K3.1 Pro 没有换底座，它是 K3 加上大得多的后训练。
      - 架构看 K3 技术报告，能力看这次的官方博客。
      - 同时发布的 Highspeed 版快二到三倍；完整权重 11 月 4 日前开放。

  # ------------------------------------------------------------------ part 1 · base
  - id: scale
    theme: kimi
    nav: base
    beats:
      - 先看底座 K3。总参数 2.78 万亿，约是 K2 的 2.7 倍。
      - 每个 token 只激活 1042 亿，不到百分之四。
      - 路由专家从 384 个加到 896 个，每次选 16 个。
      - 训练上下文从 128K 拉到 1M，整整 8 倍。
      - 架构、数据和配方合起来，扩展效率是 K2 的 2.5 倍。

  - id: attn
    theme: kimi
    nav: base
    beats:
      - 第一个设计，混合注意力：三层 KDA 接一层 Gated MLA。
      - 全模型是 69 层 KDA，加 24 层 MLA。
      - KDA 是线性注意力，只存一个固定大小的状态，不随长度变长。
      - MLA 负责全局对照，而且完全不用位置编码。
      - 报告还给 KDA 的衰减设了下界，计算能全部走 Tensor Core。

  - id: ctx
    theme: kimi
    nav: base
    beats:
      - 位置信息交给 KDA 的门控衰减，上下文就能一路外推。
      - 训练分四段拉长：预训练 8K 到 64K，退火阶段 256K 到 1M。

  - id: attnres
    theme: kimi
    nav: base
    beats:
      - 第二个设计，注意力残差。普通残差把前面各层一股脑加在一起。
      - K3 让每一层用注意力，挑着读前面各层的结果。
      - 为了省内存，按 12 层一块分成 8 块，只在块之间做注意力。

  - id: moe
    theme: kimi
    nav: base
    beats:
      - 第三个设计，Stable LatentMoE：896 个专家每次选 16 个。
      - 路由专家在一半宽度的潜空间里计算，两个共享专家保留全宽。
      - 这么稀疏，容易激活爆炸、负载不均。
      - 所以加了 RMSNorm 和新的 SiTU-GLU，给激活值封顶。
      - 再用分位数平衡，让每个专家分到差不多的 token。

  - id: vision
    theme: kimi
    nav: base
    beats:
      - 视觉也是原生的，图文视频共用一个主干。
      - 视觉编码器 MoonViT-V2 从零训练，不用 SigLIP 初始化，报告说更稳、评测也不输。

  # ------------------------------------------------------------------ part 2 · post-training
  - id: post
    theme: kimi
    nav: post
    beats:
      - 第二部分，后训练。K3 先用 SFT 冷启动。
      - 再分通用、智能体、编程三个领域做强化学习。
      - 每个领域分低、高、最高三档思考强度，一共九个专家。
      - 最后用多老师在线蒸馏，把九个专家合成一个模型。
      - 整个后训练都做量化感知训练，专家权重用 MXFP4。

  - id: k31
    theme: kimi
    nav: post
    beats:
      - K3.1 Pro 在这套流程上，把后训练算力加大了很多。
      - 联合强化学习覆盖几百个下游领域。
      - RL 框架、长上下文推理、沙箱和环境质检，整套都做了优化。
      - 内部长程编程测试，从 K3 的 55.95 升到 61.2。

  # ------------------------------------------------------------------ part 3 · evals
  - id: coding
    theme: kimi
    nav: eval
    beats:
      - 第三部分，看跑分。Terminal-Bench 4.0，K3.1 Pro 65.7。
      - Opus 5.5 是 66.4，GPT-6 Astra 是 58.2。
      - SWE Marathon，它拿了表里最高的 51.7。
      - DeepSWE 75.5，只比 DeepSeek 的 77.0 低一点。

  - id: wins
    theme: kimi
    nav: eval
    beats:
      - 智能体任务上，它在好几项拿了表内第一。
      - 带工具的 HLE 70.0，BrowseComp 92.1。
      - AutomationBench 73.3，OfficeQA Pro v2 64.4。

  - id: gaps
    theme: kimi
    nav: eval
    beats:
      - 但差距也很明显。不带工具的 HLE，它 51.1，Opus 5.5 是 59.8。
      - HLE-Diamond 只有 39.4，GPT-6 Astra 是 65.8。
      - ProgramBench 31.5，还不到 Opus 5.5 的一半。

  - id: cad
    theme: kimi
    nav: eval
    beats:
      - 博客重点讲的另一块是 3D：BenchCAD 要从多视角渲染图，写代码还原模型。
      - 带工具 92.7；不带工具 72.8，和 Opus 5.5 的 73.0 几乎持平。
      - 内部还有个人体行走仿真：167 个任务、420 次评审。
      - 模拟人从几秒就摔倒，到连续走 11.2 秒，途中还改正了 36 处力臂计算错误。

  - id: finance
    theme: kimi
    nav: eval
    beats:
      - 金融上，内部经营模拟测试从 K3 的 8.9 到 37，约 4.2 倍。
      - 财务建模提高 7.2 分，金融研究提高 11.6 分。
      - 内部高难幻觉测试，断言级幻觉率从 23.4% 降到 8.3%。
      - 博客也说明，这是找茬式压力测试，不代表日常错误率。

  # ------------------------------------------------------------------ part 4 · cyber
  - id: cyber
    theme: kimi
    nav: cyber
    beats:
      - 最后说开头那一刀。漏洞利用能力，会随后训练一路上涨。
      - 来源是中期训练语料和 RL 环境里，混着的网络安全数据。
      - 开源版把这两个阶段的这类数据都删了，保留通用编程任务。
      - 内部漏洞利用测试，不删的版本解出 90.5%，删完是 81.0%。
      - 仍比 K3 的 33.3% 高很多，但官方说落后于闭源前沿模型。
      - 原则是：开源权重，不去推高网络攻击能力的绝对前沿。

  # ------------------------------------------------------------------ outro
  - id: outro
    theme: kimi
    nav: end
    hold: 1.2
    beats:
      - 总结：底座 K3，混合注意力、注意力残差、超稀疏专家。
      - K3.1 Pro 加码后训练，编程和智能体追近闭源，知识推理还差一截。
      - 多数分数是官方自测，权重 11 月 4 日前放出，到时可以亲手验证。
