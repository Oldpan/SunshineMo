# 为什么 AI 视频里的人，经常一动不动 · 「可灵是如何诞生的」竖屏版（抖音 / 小红书 / 视频号），面向没有技术背景的观众。
# 内容只取横屏那期的三件事（说明书、改写、评委），用“只扣错误分，模型学会不动”这个坑串起来。
# 画风：像素游戏关卡（用户 2026-11-07 选定）。鲸鱼娘（像素版）= 拍视频的 AI，横屏开场的像素电视机器人 = 看懂视频的 AI。
# 出处同 ../kling-origin/source/article.md（复核只认这份资料）。
# 1080×1920 母版：关键画面放 y 300–1290（视频号 6:7 安全带），字幕由引擎抬到底部文案区上方。
meta:
  title: 为什么 AI 视频里的人，经常一动不动
  topic: 可灵是如何诞生的（竖屏）
  source: https://arxiv.org/abs/2611.04916
  voice: qwen-longanhuan
  fps: 30
  width: 1080
  height: 1920
  gap: 0.08
  scene_tail: 0.3
  # 8-bit 配乐 + 游戏音效轨都由 music.py 合成（读 build/timeline.json）。改了时间轴就重跑：
  # build_timeline.py → /usr/local/bin/python3 music.py → build_timeline.py
  bgm: build/music/music.wav
  bgm_db: -13
  sfx:
    - {at: "hook:0", sound: build/music/hits.wav, db: -13}  # 扣血、星星、弹窗、升级……整条对齐片头

readings:
  还得: hái
  省事: shěng
  还漏: hái

lexicon:
  "AI": "A I"

scenes:
  # ------------------------------------------------------------------ hook: the trap first (title on top)
  - id: hook
    theme: lavender
    data: {join: out, title: [为什么 AI 视频里的人, 经常一动不动]}
    beats:
      - 如果 AI 拍视频，出一处错就扣一分，
      - 它很快会发现，
      - {text: 最省事的办法是干脆不动。, pause: 0.5}
      - {text: 可灵团队11月3号发的技术报告里，专门提醒了这个坑。, say: 可灵团队 11 月 3 号发的技术报告里，专门提醒了这个坑。}

  # ------------------------------------------------------------------ the understanding model and its five jobs (level select)
  - id: jobs
    theme: lavender
    data: {join: both}
    hold: 0.4
    beats:
      - 报告说，现在 AI 拍视频，难的已经不是画面好不好看，
      - 而是听不听得懂你要什么。
      - 动作对不对，镜头对不对，人物是不是同一个人。
      - {text: 所以可灵背后，有一个专门负责看懂视频的大模型，, say: 所以可灵背后，有一个专门负责“看懂视频”的大模型，}
      - {text: 分成了五个岗位，, pause: 0.2}
      - 写说明书的、改写提示词的、当翻译的、当评委的，还有当考官的。

  # ------------------------------------------------------------------ LEVEL 1 说明书 (caption)
  - id: cap
    theme: lavender
    data: {join: both}
    hold: 0.5
    beats:
      - 先说说明书。
      - AI 学拍视频，看的是一段视频配一段文字，
      - 文字里漏了什么，它就学不会什么。
      - {text: 报告拿一段 17.7 秒的电影片段，做了对比。, say: 报告拿一段 17.7 秒的电影片段做了对比。}
      - 一份读着很顺的说明，把“咔”一下切镜头写成了慢慢淡出，
      - 还漏掉了一句台词。
      - 可灵的写法，连门玻璃上反着的字都写了进去。

  # ------------------------------------------------------------------ LEVEL 2 改写 (prompt enhancer): the cup
  - id: cup
    theme: lavender
    data: {join: both}
    hold: 0.6
    beats:
      - 再说改写。
      - 你可能只写了一句话，它要改写成长描述，还得合理。
      - 报告里有个例子，
      - {text: 男人把杯子放在桌上，走向门口，一边开门一边喝了一口。, pause: 0.8}
      - {text: 可杯子已经放下了。, pause: 0.5}
      - 拍视频的模型碰到这种话只能硬编，
      - {text: 要么再变出一个杯子，, pause: 0.3}
      - {text: 要么让杯子瞬移回手里。, pause: 0.3}
      - 可灵一路改进下来，合理性拿到 4 分以上的比例，
      - 从 69% 涨到了 91%。

  # ------------------------------------------------------------------ LEVEL 4 评委 (reward model): back to the trap
  - id: judge
    theme: lavender
    data: {join: both}
    hold: 0.6
    beats:
      - 最后是评委。
      - 它专门挑毛病，比如手指多一根、东西穿模、画面闪烁。
      - 要是只扣错误分，就会掉进开头那个坑。
      - 所以可灵单独加了一项分，看动得够不够，
      - {text: 动得太少也扣分。, pause: 0.6}
      - 评委自己漏看了毛病，也要扣它的分。
      - 在可灵自己的测试里，这个评委的准确率是 77.86%，
      - Gemini 是 73.54%。

  # ------------------------------------------------------------------ answer the title + sign-off
  - id: outro
    theme: lavender
    data: {join: in}
    hold: 1.0
    beats:
      - 所以 AI 视频里的人经常一动不动，不一定是它不会动，
      - 也可能是负责“看懂”的 AI，在哪一步把它教偏了。
      - 我是老潘，下期再见。
