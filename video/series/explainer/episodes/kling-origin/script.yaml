scenes:
  # ------------------------------------------------------------------ 冷开场 5 秒 · 像素风（用户 2026-11-06 选 A 机器之眼，改像素风）
  # 真实片段：Tears of Steel（CC BY 3.0），见 source/assets.md
  - id: hook
    theme: editbay
    hold: 1.9
    beats:
      - 要让 AI 拍视频，先得教它看懂视频

  # ------------------------------------------------------------------ 0 开场 · 卡通综艺台（用户 2026-11-06：换卡通风，主角用鲸鱼娘）
  - id: cover
    theme: gameshow
    beats:
      - 如果一个视频模型，被奖励模型盯着训练，
      - 而奖励模型只会挑毛病：手指多一根、物体穿模、画面闪烁，
      - 见一个，扣一次分。
      - 模型很快会找到最省事的办法：少动。
      - 动得越少，错就越少，分就越高。
      - 这是可灵团队 11 月 3 号发的技术报告里，专门提醒的一点。
      - 报告讲的不是可灵怎么画得更好，
      - 而是它背后那些负责“看懂视频”的模型，是怎么做出来的。

  # ------------------------------------------------------------------ 1 引言 · 剪辑台
  - id: chain
    theme: editbay
    beats:
      - 四年里，视频生成从 2023 年还只是设想，
      - 到 2026 年，已经能做多镜头、有对白、有音乐的完整短片。
      - 报告的判断是，瓶颈已经从“画得好不好”，
      - 转到了“听不听得懂”。
      - 画质上去了，不代表动作对、镜头对、人物前后是同一个人。
      - 所以它的核心观点是：视频生成的质量，
      - 取决于数据、条件、对齐、评测这一整条链上的理解。
      - 同样是视频里的人不动，可能是训练数据漏写了动作，
      - 可能是文本编码器丢了时间信息，
      - 也可能是奖励模型偏爱静止的画面。

  # ------------------------------------------------------------------ 2 底座 · 剪辑台
  - id: base
    theme: editbay
    beats:
      - 这条链上的模型，都来自同一个底座，叫 Kling-MLLM。
      - {text: 有 27B 的稠密版，, say: 有二十七 B 的稠密版，}
      - {text: 也有 35B 和 397B 两个 MoE 版本。, say: 也有三十五 B 和三百九十七 B 两个 MoE 版本。}
      - 语言和视觉部分，从千问 3.5 到 3.8 起步，
      - 再加上听声音的部分。
      - 图片、视频、音频，放进同一个序列。
      - 音频每 5 秒插一个时间戳，直接告诉模型现在是第几秒。
      - 这个底座再各自后训练，分出五种岗位：
      - 写 caption 的、改提示词的、文本编码器，
      - 还有奖励模型和自动评测。

  # ------------------------------------------------------------------ 3 Caption · 纸张
  - id: capwhy
    theme: peach
    style: paper
    beats:
      - 先看第一个岗位。训练视频生成模型，
      - 每段视频都要配一段文字描述，叫 caption。
      - 可灵把它叫做“语义合同”。
      - 原因是，DiT 能见到的训练视频，比语言模型见到的文字少得多。
      - 每段视频都得带上尽量多的信息。
      - caption 写了什么，生成器才学得到什么。

  - id: capcmp
    theme: peach
    style: paper
    beats:
      - 原文拿一段 17.7 秒的电影片段做对比。
      - 一条读着很顺的 caption，把硬切写成了淡出，
      - 没写片名什么时候出现，
      - 还漏掉了人物出镜前的那句台词。
      - 另一条面向生成的 caption，
      - 把三次硬切的时间、片名淡入的时间，
      - 画外音和出镜台词，还有门玻璃上反过来的字，全都写清楚了。
      - {text: 可灵的 captioner 在 VidCapBench 上准确率 21.84，, say: 可灵的 captioner 在 VidCapBench 上，准确率二十一点八四，}
      - {text: Gemini-4-Argon 是 16.20。, say: Gemini-4-Argon 是十六点二零。}

  - id: refbind
    theme: peach
    style: paper
    beats:
      - 如果用户还给了参考，比如两张人像和一段配音，
      - caption 还要写清楚绑定：谁的脸取自哪张图，
      - 谁用哪段声音，哪些不归参考管。
      - 参考已经定了的东西，文字就别再描述一遍，
      - 免得两个条件打架。

  # ------------------------------------------------------------------ 4 提示词增强 · 蜡笔
  - id: pe
    theme: yellow
    style: crayon
    beats:
      - 第二个岗位是提示词增强，简称 PE。
      - 用户不会写这么长的 caption，往往只有一句话。
      - PE 负责把这句话，改写成生成器训练时见过的写法，
      - 意思不变。
      - 训练数据是倒着造的：拿拍得好的视频的 caption，
      - 反写出用户可能会怎么说。
      - 一定要用拍得好的。如果随便抽，
      - PE 会把所有请求，都扩写成平平无奇的画面。

  - id: cup
    theme: yellow
    style: crayon
    beats:
      - 改写结果要打三项分：忠实、合理、生动。
      - 合理性有个例子：男人把杯子放在桌上，走向门口，
      - 一边开门，一边喝了一口。
      - 杯子已经放下了，他拿什么喝？
      - 生成器碰到这种文字只能自己编：
      - 要么再变出一个杯子，要么让杯子瞬移到手里。

  - id: perl
    theme: yellow
    style: crayon
    beats:
      - 这三项分，先拿来做文本级的 RL，不用生成视频，很便宜。
      - 最后才接上真正的生成器：
      - 每次改写几版，各拍一段，用奖励模型打分。
      - 报告的原话是“抬高下限，压低上限”。
      - 烂片少了，最惊艳的也少了，
      - PE 学会了躲开复杂动作和大的运镜。
      - AI 写的长剧本常常前后矛盾，所以前面还会先修一遍故事，
      - 再检索 5 条好片的 caption 当参考。
      - 合理性拿到 4 分以上的比例，从 69% 涨到了 91%。

  # ------------------------------------------------------------------ 5 文本编码器 · 扁平
  - id: te
    theme: blue
    style: flat
    beats:
      - 第三个岗位是文本编码器。
      - 改好的文字，要经过它变成生成器能读的向量。
      - 报告的结论有点反直觉：好的编码器，靠的不是更强的语言能力，
      - 而是看视频的感知训练。
      - 他们用只差一个细节的句子对，直接检查编码器分不分得开，
      - 纯文本就能先筛掉一批候选。
      - 和千问文本编码器相比，人工对比评测的偏好比做到了 1.27。

  # ------------------------------------------------------------------ 6 奖励模型 · 像素
  - id: rmwhy
    theme: lavender
    style: pixel
    beats:
      - 第四个岗位是奖励模型。生成出来的视频，要有模型来打分，
      - 告诉训练哪段好、哪里坏了。
      - {text: 可灵做了两个，都从 27B 的底座开始。, say: 可灵做了两个，都从二十七 B 的底座开始。}
      - 第一个难点是看不见。很多毛病持续不到 2 秒，抽帧一稀就漏了。
      - 所以先单独练视觉部分，比如分辨原视频和压缩重建后的视频。
      - 看不见的瑕疵，推理再久也判不出来。

  - id: grmdrm
    theme: lavender
    style: pixel
    beats:
      - 第一个模型叫 GRM，会写点评：
      - 什么瑕疵、出现在第几秒、画面上框在哪。
      - 训练它的时候有一条规则：漏报也扣分。
      - 不然它少报几个，分数反而更高。
      - 第二个叫 DRM，主要给训练打分用。
      - 几十个问题的答案位置，直接写在输入里，
      - 一次读完就出全部分数，不用一个字一个字地生成，快得多。

  - id: freeze
    theme: lavender
    style: pixel
    beats:
      - 再回到开头。报告专门写了这一条：
      - 只罚瑕疵，就等于奖励一动不动。
      - 所以“运动幅度”单独打一项分，动得太少也要扣。
      - 在可灵自己的成对测试里，DRM 准确率 77.86%，
      - GRM 74.72%，
      - Gemini-4-Argon 73.54%。

  # ------------------------------------------------------------------ 7 评测 · 剪辑台
  - id: evals
    theme: editbay
    beats:
      - 最后一个岗位是评测。报告的意思是按任务出题，堵住刷分的路。
      - 比如视频编辑，该改的要改，不该动的要保住。
      - 两项分数相乘，原样交回或者整段重画，都拿不到高分。
      - 每个失败还要能往回追：
      - 是 caption 写错了、参考绑错了，还是奖励模型带偏了。

  # ------------------------------------------------------------------ 8 结尾 · 剪辑台
  - id: outro
    theme: editbay
    beats:
      - 这份报告没有开源代码和权重，
      - 但倒着造数据、漏报也扣分、运动幅度单独打分，
      - 这几招，做视频生成的团队都能拿去用。
      - 我是老潘，下期再见。
