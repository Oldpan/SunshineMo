# Latent Space 播客（2026-10-27）：Anthropic 的 Claude 平台工程负责人 Katelyn Lesse、产品负责人 Angela Jiang 谈 Managed Agents
# 「脑手分离」和 Dreaming；数字和细节对照 Anthropic 工程博客《Scaling Managed Agents》、《How we contain Claude across
# products》和 Managed Agents 的 Dreams / Memory 文档。完整出处见 source/article.md（复核只认这份资料）。
