scenes:
  # ---------------------------------------------------------------- 开场
  - id: hook
    theme: iso
    nav: intro
    beats:
      - 同样一句话，左边的大模型一次吐一个字。
      - 右边，一次落下一串。
      - 两边的结果一字不差，右边却快得多。
      - 这就是投机解码：先让便宜的草稿去猜，大模型再一次核对。
      - 今天按出现的先后，讲五种做法。
      - MTP、EAGLE-3、DFlash、DSpark，还有 DFlash 2。
      - 从 2024 年到 2026 年，它们换的都是同一个零件：草稿机。

  # ---------------------------------------------------------------- 先猜后验
  - id: why
    theme: iso
    nav: basic
    beats:
      - 先说为什么能快。
      - 大模型生成是串行的，一次前向只出一个 token。
      - DFlash 论文的原话：推理慢，卡在显存访问上，GPU 吃不满。
      - EAGLE-3 论文的说法是：用闲着的算力，换更少的显存读取。
      - 所以让大模型一次前向，并行核对一整排草稿，就能少跑几次前向。

  - id: loop
    theme: iso
    nav: basic
    beats:
      - 一轮是这样的：草稿机先猜几个 token，放上托盘。
      - 托盘推进核对门，大模型一次前向，把它们全看一遍。
      - 从左往右，猜对的留下。
      - 遇到第一个猜错的，它和后面的全部作废。
      - 大模型在出错的位置，补上它自己的那个 token。
      - 如果全都猜对，它还会再多送一个。
      - 每轮平均落下几个，叫接受长度，记作 τ。

  - id: lossless
    theme: iso
    nav: basic
    beats:
      - 那为什么能说一字不差？
      - 接受规则看两个概率：大模型给这个词的，和草稿给的。
      - 按两者之比决定留不留，被拒的位置，再从差值里重新采样。
      - 这样输出的分布，和大模型自己一个个生成，完全一样。
      - 贪心解码更直接：草稿和大模型选的是同一个词，才留下。

  - id: knobs
    theme: iso
    nav: basic
    beats:
      - DFlash 论文把每个 token 的平均耗时，写成一个式子。
      - 分子是一轮里猜和核对的时间，分母是这一轮落下几个。
      - 想更快，要么猜得更准，让 τ 变大。
      - 要么猜得更便宜，让草稿的时间变短。
      - 下面五种方法，就是这两个旋钮的五种拧法。

  # ---------------------------------------------------------------- 01 MTP
  - id: mtp_meta
    theme: iso
    nav: mtp
    beats:
      - 第一种，MTP，多 token 预测。
      - 2024 年 4 月，Meta 的论文让模型在每个位置，同时预测后面 4 个 token。
      - 做法是一根共享的主干，上面接 4 个独立的输出头。
      - 推理时只用第一个头，另外三个头可以拿来当草稿。
      - 论文在代码任务上，测到约 3 倍的加速。
      - 不过这 4 个头各猜各的，互相看不到。

  - id: mtp_ds
    theme: iso
    nav: mtp
    beats:
      - 2024 年 12 月，DeepSeek-V3 换了个接法。
      - MTP 模块一个接一个串起来，保留完整的因果链。
      - 第 k 个模块，拿上一深度的隐状态，和第 k 个 token 的 embedding。
      - 两者各自归一化，拼在一起，投影回原来的宽度。
      - 再过一个 Transformer 块，用主模型的输出头吐出下一个词。
      - embedding 和输出头都和主模型共用，新增的只有投影和这一个块。
      - 它是和主模型一起预训练出来的，是模型自带的草稿机。

  - id: mtp_num
    theme: iso
    nav: mtp
    beats:
      - V3 只多猜 1 个 token。
      - 第二个 token 的接受率，在 85% 到 90% 之间。
      - 每秒生成的 token 数，提到 1.8 倍。
      - V3 论文也说明，MTP 首先是一个训练目标，推理时可以直接丢掉。

  # ---------------------------------------------------------------- 02 EAGLE-3
  - id: eagle_intro
    theme: iso
    nav: eagle
    beats:
      - 第二种，EAGLE-3，2025 年 3 月发布。
      - 作者来自北京大学、微软研究院、滑铁卢大学和 Vector 研究所。
      - 它是外挂的：模型训好以后，再单独训一台小草稿机。
      - 前身 EAGLE，让草稿机在特征层上做自回归。
      - EAGLE-2 再按草稿的置信度，动态长出一棵草稿树。

  - id: eagle_arch
    theme: iso
    nav: eagle
    beats:
      - EAGLE-3 的草稿机，只有一层 decoder。
      - 它从大模型的低、中、高三层各取特征。
      - 拼成三倍宽，再压回原来的宽度。
      - 第一步，用大模型的真特征，加上刚采样出的词，猜下一个。
      - 第二步，新词还没经过大模型，拿不到它的特征。
      - 就用草稿机自己上一步的输出顶上，接着猜。

  - id: eagle_ttt
    theme: iso
    nav: eagle
    beats:
      - 难点在于，推理时第二步起，吃的是自己的输出。
      - EAGLE-3 的办法叫训练时测试。
      - 训练时就把草稿机自己的输出喂回去，多走几步。
      - 同时去掉预测特征的那项损失，只管把 token 猜对。
      - 论文发现，这样训练数据越多，加速越高。

  - id: eagle_tree
    theme: iso
    nav: eagle
    beats:
      - 猜的时候按置信度长出一棵树，每个分叉是一种可能。
      - 大模型用树形注意力，一次前向核完整棵树。
      - 留下被接受的那一条枝。
      - {text: 在 Llama 3.1 8B 上，平均加速 4.44 倍，τ 是 6.23。, say: 在 Llama 3.1 八十亿参数版上，平均加速 4.44 倍，套是 6.23。}
      - 上一代 EAGLE-2 是 3.23 倍。
      - {text: 最高的一项，Vicuna 13B 写代码，到了 6.47 倍。, say: 最高的一项，Vicuna 一百三十亿参数版写代码，到了 6.47 倍。}
      - 不过草稿还是一层一层猜的：树有几层深，草稿机就要跑几次。

  # ---------------------------------------------------------------- 03 DFlash
  - id: dflash_press
    theme: iso
    nav: dflash
    beats:
      - 第三种，DFlash，2026 年 2 月，来自加州大学圣地亚哥分校的 z-lab。
      - 它把草稿换成了块扩散。
      - 输入是一个已经确认的锚点，后面跟 15 个空白的遮罩位。
      - 草稿机一次前向，把 15 个位置同时填满。
      - 草稿的时间，不再随猜的个数一个个往上加。
      - 所以草稿机可以做深一点，用到 5 层。

  - id: dflash_inject
    theme: iso
    nav: dflash
    beats:
      - 第二个关键，是大模型的特征往哪送。
      - DFlash 从大模型取 5 层特征，融合以后，注入草稿机每一层的 K 和 V。
      - 论文认为，只在入口拼进去，层数一深，信息就被稀释了。
      - 训练时随机挑锚点，把后面全部遮住。
      - 越靠后的位置，损失的权重越低。

  - id: dflash_num
    theme: iso
    nav: dflash
    beats:
      - {text: 在 Qwen3 8B 上贪心解码，平均加速 4.86 倍，τ 是 6.49。, say: 在千问3 八十亿参数版上贪心解码，平均加速 4.86 倍，套是 6.49。}
      - 同样条件下，EAGLE-3 是 1.76 倍。
      - 放到 SGLang 和 B200 上，单个请求 5.1 倍，并发 32 时还有 2.8 倍。
      - 但块里的位置是同时猜的，彼此看不见。
      - 越往后越容易错：代码任务上，条件接受率从 0.87 掉到 0.78。

  # ---------------------------------------------------------------- 04 DSpark
  - id: dspark_markov
    theme: iso
    nav: dspark
    beats:
      - 第四种，DSpark，来自 DeepSeek 和北京大学，2026 年 7 月发表论文。
      - 它的主体就是 DFlash，上面加了三样东西。
      - 第一样，Markov 头，让后一个词能看到前一个。
      - 并行出完整块的分数以后，从左往右走一遍。
      - 每一位按前一个词，查一个低秩的偏置，加到分数上再采样。
      - 论文的例子：纯并行可能拼出 of problem。
      - 采到 of 以后，course 就被抬高了。
      - 这一遍是串行的，但很轻，只多 0.2% 到 1.3% 的延迟。

  - id: dspark_conf
    theme: iso
    nav: dspark
    beats:
      - 第二样，置信度头，给每个草稿位置估一个通过的概率。
      - 它估的是：前面都对的前提下，这一个能过的概率。
      - 一路乘下去，就是这个前缀能活到第几位。

  - id: dspark_sched
    theme: iso
    nav: dspark
    beats:
      - 第三样，调度器，决定每个请求这一轮核几个。
      - 所有请求的草稿位置，按存活概率从高到低排队。
      - 一个个放进核对门，每放一个，按引擎实测的吞吐曲线算一遍总吞吐。
      - 总吞吐不再上升，就停。
      - 所以人少的时候多核几个，人一多就自动变短。
      - DeepSeek V4 线上，并发低时每个请求核 4 到 6 个，并发升高就平滑缩短。

  - id: dspark_num
    theme: iso
    nav: dspark
    beats:
      - 在 V4 线上，DSpark 替换了原来只多猜一个的 MTP。
      - 同样的总吞吐下，V4 Flash 单个用户的速度快了 60% 到 85%。
      - {text: 离线在 Qwen3 4B 上，τ 比 EAGLE-3 高 30.9%，比 DFlash 高 16.3%。, say: 离线在千问3 四十亿参数版上，套比 Eagle 3 高 30.9%，比 D Flash 高 16.3%。}
      - 后来的 V4.1，干脆在预训练里去掉了 MTP，改用 DSpark。

  # ---------------------------------------------------------------- 05 DFlash 2
  - id: dflash2_obs
    theme: iso
    nav: dflash2
    beats:
      - 第五种，DFlash 2，2026 年 8 月由 Inco AI 在博客发布，没有论文。
      - 它从一个观察出发。
      - DFlash 在第 1 个位置，第一选择只有 85.4% 是对的。
      - 但算上前 16 个候选，正确答案在里面的概率是 99.5%。
      - 对的词大多已经在候选里，只是没被挑出来。

  - id: dflash2_path
    theme: iso
    nav: dflash2
    beats:
      - 于是每个位置保留 16 个候选，排成一列。
      - 相邻两列的候选两两打分，看接在一起顺不顺。
      - 再沿着分数走一遍，选出一条连贯的路线。
      - 草稿机每一层前后，还加了一个两抽头的卷积，让每个位置混进前一个位置。
      - 选择器只加了 200 万参数，延迟多 0.6%。
      - 博客按同样设置复现了 DSpark 那种修正：多 7780 万参数，延迟多 9.6%。
      - τ 反而低一点：4.49 对 4.61。

  - id: dflash2_num
    theme: iso
    nav: dflash2
    beats:
      - {text: 在 Qwen3.5 4B 上，博客测的平均 τ：, say: 在千问3.5 四十亿参数版上，博客测的平均套：}
      - MTP 4.54，DFlash 4.92，DSpark 5.49，DFlash 2 是 5.97。
      - 这里的对照模型，是 Inco 按同样设置自己训的。
      - {text: Qwen3.8 27B 在一张 H200 上，单个请求做数学题快 3.43 倍。, say: 千问3.8 二百七十亿参数版在一张 H 两百上，单个请求做数学题快 3.43 倍。}
      - 并发 32 时，降到 1.45 倍。

  # ---------------------------------------------------------------- 对比与结尾
  - id: compare
    theme: iso
    nav: end
    beats:
      - 把五台草稿机，放回同一块板上。
      - MTP 是模型自带的，预训练时一起长出来。
      - EAGLE-3 外挂一层，一层一层猜，长成一棵树。
      - DFlash 一次压出一整块，靠的是注入每一层的特征。
      - DSpark 在这一块上，加了串行修正、置信度，和按负载决定核几个的调度。
      - DFlash 2 换了个思路，在候选里选一条连贯的路。

  - id: caveat
    theme: iso
    nav: end
    beats:
      - 最后两点提醒。
      - 各家的数字来自不同论文、不同模型、不同机器，不能直接横着比。
      - 而且并发一高，加速都会缩水。
      - EAGLE-3 批量 64 时是 1.38 倍，DFlash 2 并发 32 时是 1.01 到 1.45 倍。
      - DSpark 的调度器，正是冲着这一点去的。

  - id: outro
    theme: iso
    nav: end
    beats:
      - 先猜后验，一字不差。
      - 两年五代，变的是草稿怎么猜、猜几个、核几个。
      - 我们下期见。
