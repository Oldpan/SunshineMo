# 只改 0.016% 的数字 · 竖屏版（抖音 / 小红书 / 视频号），面向没有技术背景的观众
# 内容只取横屏那期的四个例子；出处同 ../weight-space-programming/source/article.md（复核只认这份资料）。
# 1080×1920 母版：关键画面放 y 330–1290（视频号 6:7 安全带），字幕由引擎抬到底部文案区上方。
meta:
  title: AI 给 AI 动手术：只改 0.016% 的数字，千问数学答对率 7.9% 涨到 48.1%
  topic: 权重空间编程
  source: https://rikiyat.github.io/blog/weight-space-programming/
  voice: qwen-longanhuan
  fps: 30
  width: 1080
  height: 1920
  gap: 0.08
  scene_tail: 0.3

readings:
  总冲到: chōng
  全速冲: chōng
  学差: chà
  本事还: hái
  权重: zhòng
  打转: zhuàn
  调完: tiáo
  一点点调: tiáo

lexicon:
  "AI": "A I"
  "GPT-6": "GPT 6"

scenes:
  - id: hook
    theme: particle
    beats:
      - 一个 AI 给另一个 AI 动了个小手术，
      - 只改了万分之一点六的数字，它的数学答对率从 7.9% 涨到 48.1%。
      - 没有重新训练，是直接改的。

  - id: numbers
    theme: particle
    beats:
      - AI 模型的脑子里，装的是一大堆数字，叫权重。
      - 它会做什么、做得好不好，全看这些数字。
      - 平时这些数字靠训练一点点调：做题，对答案，改一点，重复几亿次。
      - 调完以后，光看这些数字，很难看出它学会了什么。
      - MIT 的研究者这回让大模型 GPT-6 Astra 直接看、直接改这些数字。

  - id: read
    theme: particle
    beats:
      - 他们先拿出四个玩小游戏的 AI，每个都是一万七千多个数字，结构一模一样，只是数字各不相同。
      - Astra 只看数字，就认出了谁在玩哪个游戏。
      - 比如打砖块那个，管“自己在哪”的数字全挤在最底下一行，它就猜到底部有块挡板。

  - id: car
    theme: particle
    beats:
      - 再看一辆小车，它总冲到坡上就停住，256 次一次没成。
      - Astra 发现它几乎从来不倒车，就在里面加了条小路：先倒车助跑，再全速冲。
      - 改了 3.5% 的数字，1024 次全部成功。

  - id: scratch
    theme: particle
    beats:
      - 它还能从零写。数字全是 0，不给练习，只给游戏规则。
      - 它一次写出的打砖块 AI 平均拿 517 分，用常规方法训练了 5 亿步的 AI 只有 25 分。

  - id: qwen
    theme: particle
    beats:
      - 最后是千问 3.5，一个有 8 亿个数字的真模型。
      - 它数学差，不是不会算，是爱“打转”，一句话翻来覆去地写，写满了也给不出答案。
      - Astra 在第 15 层和第 19 层找到了推着它打转的那股劲，把它减掉了。
      - 一共只动了 0.016% 的数字，数学答对率从 7.9% 涨到 48.1%，听指令的成绩也从 21% 涨到 62.3%。
      - 不过换一个本来就不打转的小模型，它就提不上去了。
      - 作者说，在这个例子里，改数字能搬走挡路的石头，变不出模型本来没有的本事。

  - id: outro
    theme: particle
    hold: 0.8
    beats:
      - 作者也说，现在这本事还很有限，全部实验记录都公开了。
      - 我是老潘，下期再见。
