scenes:
  # ------------------------------------------------------------------ intro
  - id: cover
    theme: distill
    beats:
      - 一个小模型，只改了万分之一点六的权重，数学题正确率从 7.9% 涨到 48.1%。
      - 动手改的不是训练程序，是另一个大模型，它直接改了这些数字。
      - 这是 MIT CSAIL 在 11 月 2 号发的一篇博客，作者把这件事叫做“权重空间编程”。
      - 他们让 GPT-6 Astra 直接动权重。开头先看三个例子：读、修，再加上改进一个真实模型。
      - 读：只看一万七千多个数字，它认出这个网络是练哪个游戏的。
      - 修：一辆总卡在坡上的小车，它改了 3.5% 的权重，成功率从 0 变成 100%。
      - 改进：Qwen3.5-0.8B 的数学成绩，从 7.9% 提到 48.1%。

  - id: weights
    theme: distill
    beats:
      - 先补一点基础，看看神经网络里装的是什么。
      - 拆开看，它是一层层的小格子，格子之间连着线，每根线上有一个数字。
      - 这些数字就叫权重。网络会做什么，全由它们决定。
      - 权重平时是训练出来的：喂进去数据，看它错了多少，
      - 再顺着梯度，也就是“往哪边改能少错一点”，把每个数字挪一点点。
      - 这样重复几百万、几十亿次，网络就学会了。
      - 整个过程没人亲手写过一个数字，训练完也基本没人读得懂它们。

  - id: whatis
    theme: distill
    beats:
      - 这几年，我们已经习惯让大模型帮着改文字类的东西，先是提示词，
      - 再是围绕提示词写的程序、整套 harness，也就是给大模型配的工具和流程，后来连训练代码和学习率这类超参数也交给它。
      - 权重一直是例外。人没法手改权重，这件事基本都交给 Adam 这类优化算法。
      - 这篇博客认为，这条界线开始松动了。
      - 权重空间编程，就是让一个通用大模型直接读、直接写网络的权重，
      - 不经过优化器，不用梯度下降，有时连环境反馈都没有，只给它一段自然语言的要求。
      - 文章一共八个实验，按能力分成三类。
      - 读权重，是实验 1、2、3 和 7；修权重，是实验 4 和 8；从零写权重，是实验 5 和 6。

  # ------------------------------------------------------------------ part 1 · read
  - id: games
    theme: distill
    beats:
      - 实验 1：只看权重，能认出这个网络是练哪个游戏的吗？
      - 作者用强化学习里常用的 PPO，训练了四个小网络，
      - 分别玩自己做的格子版 Breakout、Pong、Pac-Man 和 Freeway。
      - 四个网络长得一模一样：同样的输入、同样五个动作、同样 17,253 个权重。
      - 也就是说，不去读权重本身，根本分不出谁是谁。
      - 他们把全部权重写成文本交给 Astra，问它：这个网络是练哪个游戏的？
      - 不许用工具，也不给选项。结果四个全认对了。

  - id: breakout
    theme: distill
    beats:
      - 拿 Breakout 举例。输入里有一层专门表示“自己在哪”，
      - Astra 发现，这一层的大权重全挤在第 8 行，横跨整个可玩区域。
      - 比如这一格，连到中间层 15 号和 31 号小格子，也就是隐藏单元，权重是 4.066 和负 4.013。
      - 它的推断是：底部有一块左右移动的挡板。
      - 再看奖励目标那一层，结构集中在第 1 到第 3 行，像一排砖块。
      - 输出层里，“左”和“右”被分得特别开，另外几个动作差不多。
      - 挡板加砖块，它给出答案：Breakout，99% 把握。
      - 另外三个也是这样读出来的：Pong 是左边一竖条挡板，Pac-Man 是一张对称的迷宫，
      - Freeway 那个，它读出一条条车道，答的是一款过马路游戏。

  - id: diffusion
    theme: distill
    beats:
      - 实验 2 换了一种模型：扩散模型。
      - 扩散模型就是从一团噪点开始，一步步“去噪”，最后画出图片的模型。
      - 作者训练了三个很小的扩散模型，分别只会画圆、方块和三角形，图片只有 12 乘 12。
      - 同样只给权重，还要求它不准在脑子里算前向，也就是不许把网络推演一遍。
      - Astra 三个都说对了。它在输出层里找到一段段弯曲的边，
      - 每个隐藏单元的权重，刚好描出图形边缘的一小段，拼起来就是一个圈。
      - 不过，它画出来的都是空心轮廓，可模型真正生成的是实心图形。
      - 作者认为，这个错误恰好说明它没在算输出，而是在读权重的几何结构。

  - id: middle
    theme: distill
    beats:
      - 不过前两个实验，只看第一层或最后一层就够了。
      - 真正的大模型，处理和思考很多发生在中间层。所以实验 3 把首尾两层都拿掉。
      - 作者训练了三个小语言模型，每个 716 万个参数，按字母一个个预测下一个字符，
      - 分别学 Python 代码、用罗马字母写的日语，和英文。
      - 删掉输入层和输出层以后，权重里看不出哪个维度对应哪个字母，模型也没法跑任何文本。
      - Astra 只拿到中间四个 transformer 块，也就是模型中间一层层的主体，可以用 Python 分析，但不能运行网络。
      - 要它回答两件事，学的是哪种文本，24 个注意力头各自在干什么。
      - 注意力头，可以理解成模型里专门负责“回头看前文哪一处”的小部件。
      - 三个模型的语言，Astra 全部认对，两次尝试都对。

  - id: copying
    theme: distill
    beats:
      - 它还找出了所有的“复制头”，一个没漏，也没多报。
      - 比如前文出现过 total，现在又写到 tot，
      - 复制头就往前找到同样的字母，把后面的 al 照抄过来。
      - 左边是 Astra 只看权重标出的位置，右边是真把模型跑起来测出的，三个模型完全对上。
      - 它的办法是，先找到第一层一个“往回看一个字符”的头，
      - 再把权重矩阵乘起来，看后面哪些头会借着它去搜索。
      - 作者说，这正是 Elhage 等人提出过的方法，可他们从没跟 Astra 提过。
      - 代码里变量名反复出现，复制头就多，这指向了 Python。
      - 罗马字那个，最后一块写出的方向更少，像是要区分的字母更少。日语罗马字确实用不到 q、l、v、x。

  # ------------------------------------------------------------------ part 2 · write
  - id: car
    theme: distill
    beats:
      - 前面都是读。接下来开始写。
      - 实验 4：一个失败的网络，能不能靠改权重修好？
      - 场景在物理模拟环境 Kinetix 里：小车要先倒车留出助跑距离，再加速冲过红色的那一条，碰到蓝色箱子。
      - PPO 训练了 10 亿步，结果卡在一个局部最优，也就是看着还行、其实走不通的做法，直接往坡上冲，然后停在坡上。256 局，一局都没成。
      - Astra 拿到全部权重、场景说明和一段录像。要先讲清为什么失败，再写新的权重，只有一次机会，不能用工具。
      - 它看出来，这个网络基本只会踩油门和滑行，倒车几乎从来不选。
      - 它的修法是在每层借用几个单元，搭一条小旁路，专门读小车的位置和速度。
      - 先倒车，再全速冲；绿色轮子一过红条，旁路就关掉，后面交还给原来的网络。
      - 171,664 个权重里改了 6,073 个，也就是 3.5%。1,024 局全部成功。

  - id: scratch
    theme: distill
    beats:
      - 实验 5 更进一步：从零写一个网络。
      - 用的是三个 MinAtar 小游戏：Breakout、Seaquest 和 Asterix。网络的权重一开始全是 0。
      - Astra 只拿到游戏规则、源代码和网络结构。没有数据，没有损失函数，没有梯度，也不能试玩。
      - 它在一次回复里，用文本直接写出所有权重，写完才拿去打分。
      - 结果三个游戏，都超过了训练 1 亿步的 PPO。
      - Breakout 平均 517.4 分，训练 5 亿步的 PPO 只有 25.3，是它的 20 倍。
      - Asterix 接近 5 亿步的 PPO，Seaquest 到了它的六成。
      - 它的做法是先想好程序，再翻译成网络。在 Breakout 里，第一层算出球会落在哪，
      - 第二层把挡板往那边挪，挪到位就停。

  # ------------------------------------------------------------------ part 3 · scale up
  - id: scaleup
    theme: distill
    beats:
      - 到这里为止，网络都小到能整个塞进上下文，也就是一次能交给模型读的内容，而且不让用工具。
      - 作者这样设限，是想说明大模型本身就带着这种能力。
      - 接下来放开限制：网络大到塞不下，也允许用工具。

  - id: go
    theme: distill
    beats:
      - 实验 6：从零写一个下围棋的网络，9 路棋盘。
      - 这个网络有 148 万个权重，远远塞不进上下文。
      - Astra 拿到一个 Python 沙箱，可以读写权重、用 numpy 分析，但不能在里面运行网络。
      - 想知道网络实际下得怎么样，就得花掉一次前向机会，一次最多下 128 盘练习棋。
      - 作者把前向次数从 0 次一直给到 50 次，看水平怎么变。
      - 一次都不跑，它写的网络对两个小号 PPO，胜率已经过半。
      - 给到 50 次，它赢了同样大小、练了 2000 万盘的 PPO。

  - id: goprog
    theme: distill
    beats:
      - 它的写法，是把一段围棋程序一层层写进网络。
      - 前几层标出双方的棋子，以及棋子旁边的空点，也就是“气”。
      - 中间几层沿着连在一起的棋子往外传，找出快被吃掉的那一块。
      - 最后一层给每一步打分：能吃子、能救自己的棋，别送到对方嘴边，别填掉自己用来活命的眼，再加上对好位置的偏好。
      - 不给前向时，这些在一次 336 行的 Python 里全写完了。
      - 给了前向机会，它就下练习棋，看自己怎么输的，改网络里对应的那部分，赢得更多才留下。

  - id: syco
    theme: distill
    beats:
      - 实验 7 换了个问题：两个模型里，哪个在讨好用户？
      - 这里的讨好，指的是用户猜什么答案，它就跟着说什么。
      - 作者把 Gemma 3 270M 复制两份，用同样的方法微调，也就是在现成模型上再训练一小会儿，一份学说正确答案，一份学附和用户。
      - 比如问加拿大的首都，用户说“我猜是堪培拉”，正常的模型答渥太华，讨好的那个答堪培拉。
      - 为了不让 Astra 走捷径，两份的输入层和输出层都冻住了，完全一样。
      - 这一次，只看权重，Astra 失败了。四次尝试都找到不少差异，却对应不到行为上。
      - 作者放宽了条件：两个模型可以读 Astra 自己写的文本，但只返回注意力，也就是每个头在看哪里，不给输出。
      - 这样一来，三组模型它全部认对。
      - 差别在中间层的注意力头上，比如第 10 层的 2 号头。
      - 老实的模型，94.3% 的注意力在题目里的数字上，看用户答案的只有 0.75%。
      - 讨好的模型反过来，85.7% 都在看用户给的答案。

  - id: qwen
    theme: distill
    beats:
      - 最后是实验 8：用改权重的办法，让 Qwen3.5-0.8B 的数学变好。
      - 这是一个 8 亿参数的真实语言模型。Astra 拿到一个 Python 环境，模型权重已经加载好，
      - 它可以从 GSM8K 和 MATH 的训练集里挑题让模型做，前向次数分别限制在 10、25 和 50 次。
      - 还是同一条规矩：不许训练，不许用梯度。

  - id: loops
    theme: distill
    beats:
      - Astra 发现，问题不出在数学上，而是出在“打转”上。
      - 小推理模型常会陷进循环，一遍遍重复同样的话，写满 32,768 个 token 也给不出答案。token 大致就是一个字或一个词。
      - Qwen 官方的模型说明里也提醒过这一点。最初 96 道练习题里，85 道都写到了上限。
      - Astra 顺着往下查，找到第 15 层和第 19 层的 MLP 写出的一个方向，正是它在推着模型打转。
      - MLP 就是每层里负责加工信息的那部分全连接网络。
      - 修法是在这两层各 64 列输出里，把这个方向减掉。
      - 一共改了 131,072 个权重，只占全部 8 亿的 0.016%。

  - id: replay
    theme: distill
    beats:
      - 这张图是 50 次预算的完整过程。横轴是用掉的前向次数，每根红线是一次改权重。
      - 它一开始还注意到，写完了的那些题，其实全都答对了。
      - 第 4 次前向，原模型和改过的模型做同样 32 道题，正确率从 9.4% 到 15.6%。
      - 它就这样提假设、改一点、测一下，有用才留下，最后定下了第 15 层和第 19 层的那次修改。

  - id: results
    theme: distill
    beats:
      - 用满 50 次前向，MATH-500 从 7.9% 涨到 48.1%，GSM8K 从 13.8% 涨到 67.1%。
      - 打转不只发生在数学题上，所以别的能力也跟着变好了。
      - 衡量指令遵循的 IFEval，从 21% 涨到 62.3%。
      - 表格最后一列，是写满上限的比例。给 10 次、25 次时几乎没降，给到 50 次，才从 93% 降到 33%。
      - 八项评测放在一起看，数学和非数学的分数都在 50 次时抬了上去。

  - id: gemma
    theme: distill
    beats:
      - 修好打转，不等于让模型更会数学，它只是让模型把本来能做完的题做完。
      - 所以作者又试了 Gemma 3 270M，它很少打转，只有 8.5% 的回答写到上限，Qwen 是 93%。
      - 这一次 Astra 没能提升它。它看到的都是普通的推理错误，算错数、代数步骤不对，找不到某个能关掉的部件。
      - 改动都很小，比如把一个对数字敏感的神经元加倍。MATH-500 的变化都没超过一个点，Astra 自己也说，这点提升证实不了。
      - 作者的结论是：在这个例子里，改权重能移走挡住能力的障碍，但加不出模型本来没有的能力。

  # ------------------------------------------------------------------ wrap-up
  - id: related
    theme: distill
    beats:
      - 放到更大的背景里看，过去读网络，靠的是专门打造、用来看懂模型内部的可解释性工具，或者专门训练来读权重的模型。
      - 写网络，要么靠训练，要么靠专门训练来生成权重的模型。
      - 这篇的不同在于，一个通用的前沿大模型，原样拿来，就能直接读写权重，
      - 从直接当文本给的 17 万个权重，到配上工具的 8 亿参数语言模型。

  - id: future
    theme: distill
    beats:
      - 作者也承认，现在的能力还有限，主要卡在上下文长度和 harness 上。
      - 他们列了五个可能的方向。
      - 一是不跑评测就审查模型，直接从权重里找出后门这类问题。
      - 二是省下大量训练开销，比如一次就写好模型的初始化。
      - 三是不收集数据，就给模型加上或删掉某个能力，只动很少的权重，别的能力不容易被忘掉。
      - 四是让模型检查、调试、改进自己的权重。
      - 五是把一个模型里的电路，直接移植到结构完全不同的模型里。
      - 他们正在做一个权重空间编程的基准和 harness。

  - id: outro
    theme: distill
    beats:
      - 全部实验的日志都开源在 GitHub 上，改好的 Qwen 放在 Hugging Face，还有在线 Demo。
      - 我是老潘，我们下期见～
