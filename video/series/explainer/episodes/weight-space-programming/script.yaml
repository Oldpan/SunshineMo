# MIT CSAIL 博客《Sparks of Weight-Space Programming: LLMs can natively read & write neural network weights》
# （Takehi / Teoh / Zhang / Khattab，2026-11-02）。按原文顺序讲 8 个实验，原文的交互图用它自己的 JSON 数据复现。
# 面向小白：先讲权重和训练是什么，术语都配一句大白话。完整出处见 source/article.md（复核只认这份资料）。
meta:
  title: 只改 0.016% 的权重，Qwen 数学从 7.9% 涨到 48.1%：大模型开始直接读写神经网络权重
  topic: 权重空间编程
  source: https://rikiyat.github.io/blog/weight-space-programming/
  voice: qwen-longanhuan
  fps: 30
  width: 1920
  height: 1080
  gap: 0.1
  scene_tail: 0.3

