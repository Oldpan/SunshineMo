# Per-scene style catalogue for 讲透 / 讲解 episodes (2026-11-10).
# Read by whoever builds the per-scene candidate board (记忆 per-scene-style-mix): for each scene give the user 2–3
# candidates (母版 + the best `uses` match + one fallback), recommended one pre-ticked, and let the user decide.
# Looks come from the Drive reference set described in docs/reference/ai-news-explainer-style.md.
#
# kit      : file under shared/ (or the engine's own style) that draws it today
# status   : ready = a kit exists and is used by an episode | new = kit added 2026-11-10, rendered as stills only
#            | engine = the narrated renderer's built-in style | todo = documented, not built
# uses     : what the scene is about, in the words the script uses
# avoid    : when it reads wrong
# max_run_s: longest a single run of this look should last
# bg_moves : how the background keeps moving (every look must, or long sentences trip freezedetect)

master:
  id: prodpage
  name_zh: 产品页舞台（母版）
  kit: shared/prodpage.tsx
  status: new
  palette: {bg: '#F1EEE7', card: '#FCFBFA', ink: '#1B1B1B', accent: '#E2603F'}
  uses: [产品介绍, 流程, 对比, 步骤清单, 数字结论, 开场, 结尾来源]
  avoid: [纯情绪段, 需要大场面的段落]
  bg_moves: 点阵底纹缓慢漂移 + 卡片逐块长出
  share: 60-70% of the video

interludes:
  - id: pixel
    name_zh: 像素游戏关卡
    kit: shared/pixelplay.tsx
    status: ready
    palette: {bg: '#1E1838', floor: '#3B2F6B', cream: '#FFFCF4', accent: '#F0566A'}
    uses: [循环和迭代次数, 规则逐条解锁, 额度和限制, 多个角色接力, 前后对比结果]
    avoid: [严肃的安全 / 合规结论, 需要精确读数的长表格]
    max_run_s: 40
    bg_moves: 星点闪烁 + 天际线小窗灯 + 角色待机晃动
  - id: comic
    name_zh: 美漫波普
    kit: shared/comicpop.tsx
    status: new
    palette: {dots: '#35C5F1', panel: '#FEF5E1', ink: '#2C3243', burst: '#FFD23F', red: '#E8412F'}
    uses: [痛点和崩溃时刻, 社区吐槽, 产品突然出现, 问题就在这]
    avoid: [数据密集的段落, 超过 15 秒的平铺直叙]
    max_run_s: 15
    bg_moves: 半调圆点缓慢斜移 + 星爆轻微旋转
  - id: notebook
    name_zh: 螺旋笔记本
    kit: shared/notebook.tsx
    status: new
    palette: {desk: '#3A3F46', paper: '#F4F5F0', grid: 'rgba(60,90,120,0.14)', pen: '#D93A2B', sticky: '#BDEBD3'}
    uses: [引用原文里的图表和实验数据, 作者怎么说, 需要圈出的数字]
    avoid: [没有数据可圈的纯概念段]
    max_run_s: 35
    bg_moves: 桌面暗角缓慢推近 + 红笔圈一笔画出
  - id: blueprint
    name_zh: 蓝图
    kit: shared/stylemix.tsx   # BlueprintBg / BpBox / Draw
    status: ready
    palette: {bg: '#0F4C8A', line: 'rgba(232,242,255,0.92)', red: '#FF9B8A'}
    uses: [规格和 API 参数, 安全设计图, 步骤, 曲线图坐标说明]
    avoid: [情绪段]
    max_run_s: 40
    bg_moves: 网格缓慢爬行 + 线条逐笔画出
  - id: console
    name_zh: 暗色控制台 / LED 记分牌
    kit: shared/console.tsx    # also stylemix.tsx TermBg / TermWin
    status: ready
    palette: {bg: '#1B1823', ink: '#D6D4CC', hi: '#F2C46D', ok: '#6FCF97', err: '#EF7D6D'}
    uses: [代码和日志, 实时监控, 占比和排名, 工程师反馈引用]
    avoid: [面向非技术观众的竖屏版]
    max_run_s: 40
    bg_moves: 光标闪烁 + 日志逐行滚入 + 扫描线
  - id: chalk
    name_zh: 黑板粉笔
    kit: shared/notebook.tsx   # ChalkBg / ChalkText
    status: new
    palette: {board: '#2B2E2C', wood: '#5B4126', chalk: '#EDEBE3', pink: '#F2A1A1', yellow: '#F5D97A'}
    uses: [概念从零推导, 层层追问, 先看它是做什么的]
    avoid: [数据图表]
    max_run_s: 30
    bg_moves: 粉笔字逐笔写出 + 黑板尘雾缓慢飘
  - id: kraft
    name_zh: 牛皮纸 / 软木板拼贴
    kit: shared/stylemix.tsx   # CorkBg / Note / Stamp / DossierBg
    status: ready
    palette: {bg: '#DED4C6', cork: '#C9A77C', paper: '#F7F1E3', stamp: '#B52A1C'}
    uses: [证据板, 一组案例, 成绩单, 三条经验]
    avoid: [需要读长段文字的场景]
    max_run_s: 35
    bg_moves: 纸片轻微落位旋转 + 慢推镜
  - id: glass
    name_zh: 渐变玻璃卡
    kit: shared/glass.tsx
    status: new
    palette: {from: '#F9C9DD', via: '#CDB8F7', to: '#9CC6FB', card: 'rgba(255,255,255,0.62)'}
    uses: [产品功能, 模型对比, 版本和档位, 两个新模型并列介绍]
    avoid: [暗色大数据]
    max_run_s: 35
    bg_moves: 渐变光斑缓慢漂移 + 浮球上下
  - id: poster
    name_zh: 电影感大字海报
    kit: shared/prodpage.tsx   # Poster
    status: new
    palette: {bg: '#10131C', ink: '#F4F1EA', accent: '#E2603F'}
    uses: [开场, 章节首页, 一个数字撑起一页]
    avoid: [信息密集的内容页]
    max_run_s: 8
    bg_moves: 氛围图慢推 + 光斑
  - id: mascot
    name_zh: 角色陪看
    kit: shared/pixelplay.tsx  # Mascot / shared/gameshow.tsx Bean
    status: ready
    uses: [贯穿全片的引路人, 疑问 / 结论的情绪点缀]
    avoid: [使用别人品牌的角色]
    max_run_s: 0   # an overlay, lives in a corner across scenes
    bg_moves: 角色待机呼吸 + 表情切换
  - id: crayon
    name_zh: 蜡笔手绘
    kit: engine   # style: crayon
    status: engine
    uses: [温情的人情场景, 把冷技术拉回生活]
    avoid: [数据]
    max_run_s: 20
    bg_moves: 蜡笔笔触逐笔涂出
  - id: datajournal
    name_zh: 数据新闻图表
    kit: shared/stylemix.tsx   # DataBg; numbers: claudeblog.tsx
    status: ready
    palette: {bg: '#EBE6DA', red: '#E2603F', blue: '#2F6FEB', green: '#2F9E6A'}
    uses: [报告里的曲线, 占比, 前后变化]
    avoid: [情绪段]
    max_run_s: 40
    bg_moves: 折线逐段画出 + 数字滚动
  - id: iso
    name_zh: 等距 / 线路图
    kit: shared/iso/
    status: ready
    uses: [系统架构, 数据流, 并行线程]
    avoid: [没有空间关系的概念]
    max_run_s: 40
    bg_moves: 推镜 + 上滑 + 点阵漂移
  - id: ranking
    name_zh: 倒数榜单
    kit: shared/prodpage.tsx   # RankBadge
    status: new
    uses: ['N 个用法 / 案例 / 坑', 一条一页悬念]
    avoid: [少于 5 条的清单]
    max_run_s: 0   # a whole-video structure, not a scene
    bg_moves: 名次徽章弹出 + 背景色逐名更换

# ---------------------------------------------------------------------------------------------------------------
# 竖版短篇 (9:16 master, key content inside SAFE x 100–960 / y 330–1290; 非技术观众). Added 2026-11-14.
# Same idea as 横版: one master for most of the video, a small fixed pool of interludes, 2–3 candidates per scene.
# A look that exists in both orientations keeps ONE id: `same_as` names the 横版 entry above, `kit` is the 9:16 build.
# Do not build a new vertical kit when one of these fits; a new look goes into an existing kit as a new id.
vertical:
  master:
    id: popflat
    name_zh: 扁平动态图形（竖版母版）
    kit: shared/popflat.tsx   # Stage / Card / Pill / Burst / Ring / slam
    status: ready             # claude-code-diet-shorts; its motion helpers also drive vstyles and particles
    palette: {bg: '#1F2EF5', ray: '#2A39FF', ink: '#1A1F5C', white: '#FFFFFF', yellow: '#FFD23F', coral: '#FF6B4A'}
    uses: [开场钩子, 一句话结论, 三件事清单, 前后对比, 结尾]
    avoid: [需要细看原图的段落]
    bg_moves: 放射光缓慢旋转 + 碎片漂浮 + 卡点震屏
    share: 60-70% of the video
  interludes:
    - id: pixel
      same_as: pixel
      kit: shared/pixelplay.tsx
      status: ready             # kling-origin-shorts
      uses: [循环和次数, 规则逐条解锁, 小故事, 角色接力]
      max_run_s: 40
    - id: particles
      name_zh: 数字粒子
      kit: shared/particles.tsx
      status: ready             # weight-space-programming-shorts
      uses: [看不见的东西（权重、数字、信号）, 一个数字拼出来, 揭晓时刻]
      avoid: [需要读字的长段落]
      max_run_s: 30
      bg_moves: 数字雨下落 + 粒子聚形
    - id: gallery
      name_zh: 展厅画廊
      kit: shared/vstyles.tsx   # GalleryStage / Frame / Placard
      status: ready             # minimax-h3-image-shorts
      uses: [展示生成的图 / 视频作品, 官方样张, 前后对比的两张图]
      avoid: [没有图可挂的段落]
      max_run_s: 30
      bg_moves: 聚光灯呼吸 + 浮尘 + 画框慢推
    - id: data
      same_as: datajournal
      kit: shared/vstyles.tsx   # DataStage / HBar
      status: ready             # minimax-h3-image-shorts
      uses: [跑分, 速度和价格, 一个大数字, 按比例的横条]
      max_run_s: 30
    - id: blueprint
      same_as: blueprint
      kit: shared/vstyles.tsx   # BlueprintStage / BpBox / BpArrow
      status: ready             # minimax-h3-image-shorts
      uses: [结构和流程, 参数规格, 它是怎么做到的]
      max_run_s: 30
  # Built once, kept for when a scene clearly needs them; not offered by default on the candidate board.
  reserve:
    - id: darkroom
      name_zh: 胶片暗房
      kit: shared/vstyles.tsx   # DarkroomStage / FilmFrame / Grease
      uses: [逐张审片, 圈出图里的问题]
    - id: editorial
      name_zh: 杂志编辑排版
      kit: shared/vstyles.tsx   # EditorialStage   (横版同款：stylemix.tsx EditBg)
      uses: [引用原话, 官方声明]
  # 横版 looks that read wrong on 9:16 for 非技术观众: console (see its avoid), iso, chalk, notebook.

# Look-only candidates for the code engine (一帧一理 series): user picks the style before each episode.
code_engine_candidates:
  - id: woodcut_night
    name_zh: 靛蓝木刻星夜
    status: todo
    palette: {night: '#121A4F', moon: '#E2D0AB', sepia: '#2C2117'}
    notes: 点刻（stipple）月面、青海波纹、扫描线纸面、细密排线；一个黑色小圆团子一路旅行，每 2–3 秒一景，溶解转场。参考：Drive reference/Kimi_K3.1_Pro_小红书笔记.mp4（25 秒，纯管弦乐）。
